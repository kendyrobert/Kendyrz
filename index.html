menu(id,el){const f=byId(id),r=el.getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.style.top=Math.max(8,Math.min(r.bottom,innerHeight-290))+'px';p.style.left=Math.max(8,Math.min(r.right-170,innerWidth-186))+'px';
const L=S.view==='trash'?[['restore',ico('restore',16)+'Restaurar'],['purge1',ico('trash',16)+'Eliminar para siempre']]:[['open',ico(f.isFolder?'folder':'eye',16)+(f.isFolder?'Abrir':'Ver')],...(f.isFolder?[]:[['dl',ico('download',16)+'Descargar'],['share',ico('link',16)+'Compartir y QR']]),['rename',ico('edit',16)+'Renombrar'],['trash',ico('trash',16)+'A la papelera']];
p.innerHTML=L.map(([a,l])=>`<button data-a="${a}" data-id="${id}">${l}</button>`).join('');document.body.append(p)},
async rename(id){const f=byId(id),m=await modal('Renombrar',`<input id="mi" value="${esc(f.name)}" maxlength="150">`,'Guardar'),n=m?.querySelector('#mi').value.trim();if(!n||n===f.name)return;await updateDoc(doc(db,'files',id),{name:n});if(S.shares.some(s=>s.id===id))await updateDoc(doc(db,'shares',id),{name:n});toast('Renombrado')},
async trash(id){await setT([id])(true);toast('Enviado a la papelera')},
async restore(id){await setT([id])(false);toast('Restaurado')},
async purge1(id){if(await modal('Eliminar para siempre',`<p>«${esc(byId(id).name)}» se borrará definitivamente.</p>`,'Eliminar')){await purge([id]);toast('Eliminado definitivamente')}},
async empty(){const ids=S.files.filter(f=>f.trashed&&live(f)).map(f=>f.id);if(ids.length&&await modal('Vaciar papelera',`<p>Se borrarán ${ids.length} elemento(s) para siempre.</p>`,'Vaciar')){await purge(ids);toast('Papelera vaciada')}},
async share(id){const f=byId(id),s=S.shares.find(x=>x.id===id);if(!s)await setDoc(doc(db,'shares',id),{ownerId:S.user.uid,name:f.name,size:f.size,mime:f.mime||'',url:f.url,createdAt:serverTimestamp(),active:true,downloads:0});else if(!s.active)await updateDoc(doc(db,'shares',id),{active:true});return act.qr(id)},
async qr(id){const L=link(id),nm=(byId(id)||S.shares.find(x=>x.id===id)||{}).name||'archivo',{default:Q}=await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm'),img=await Q.toDataURL(L,{width:360,margin:2,color:{dark:'#0a0f1f',light:'#ffffff'}});
if(await modal('Compartir archivo',`<p class="mu">${esc(nm)}</p><div class="qr"><img src="${img}" alt="Código QR"></div><input readonly value="${L}" onfocus="this.select()"><a class="btn ghost" href="${img}" download="QR-${esc(nm)}.png">${ico('download',16)} Guardar imagen del QR</a>`,'Copiar enlace'))copy(L)},
cp(id){copy(link(id))},async tog(id){const s=S.shares.find(x=>x.id===id);await updateDoc(doc(db,'shares',id),{active:!s.active});toast(s.active?'Enlace desactivado':'Enlace activado')},
async saven(){const n=$('#pn').value.trim();if(!n)return toast('El nombre es obligatorio',1);await updateProfile(auth.currentUser,{displayName:n});await updateDoc(doc(db,'users',S.user.uid),{name:n});toast('Nombre actualizado')},
async savep(){const p=$('#np').value;if(p.length<8||!/[A-Za-z]/.test(p)||!/\d/.test(p))return toast('Mínimo 8 caracteres, con letras y números',1);await updatePassword(auth.currentUser,p);$('#np').value='';toast('Contraseña cambiada')},
rst(){return sendPasswordResetEmail(auth,S.user.email).then(()=>toast('Correo enviado'))},
out(){return signOut(auth)},
photo(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>5e6)return toast('La foto debe pesar menos de 5 MB',1);try{const j=await cld(f);await updateDoc(doc(db,'users',S.user.uid),{photo:j.secure_url});toast('Foto actualizada')}catch(e){toast(em(e),1)}};i.click()}};

async function pub(id){$('#app').innerHTML=`<div class="authw"><div class="authb" id="pb" style="text-align:center"><div class="logo">${brand()}</div><p class="mu">Cargando…</p></div></div>`;
try{const d=await getDoc(doc(db,'shares',id));if(!d.exists()||!d.data().active)throw 0;const s=d.data(),f={name:s.name};document.title=s.name+' · Storcloud';const k=kind(f),e=ext(s.name),u=s.url;
const pv=k==='image'?`<img src="${u}" alt="">`:k==='video'?`<video src="${u}" controls playsinline></video>`:k==='audio'?`<audio src="${u}" controls></audio>`:e==='pdf'?`<iframe src="${u}"></iframe>`:`<div class="bigic">${icon(f)}</div>`;
$('#pb').innerHTML=`<div class="logo">${brand()}</div><div class="pv">${pv}</div><h2 style="word-break:break-all">${esc(s.name)}</h2><p class="mu">Tipo: ${(e||'archivo').toUpperCase()} · ${sz(s.size)} · ${fd(s.createdAt.toMillis())}</p><br><button class="btn big" id="pd">${ico('download',17)}<span>Descargar</span></button><div class="lk"><a id="hm">Ir a Storcloud</a></div>`;
$('#pd').onclick=async()=>{try{await updateDoc(doc(db,'shares',id),{downloads:increment(1)})}catch{}dl(s.name,u)};$('#hm').onclick=()=>{location.hash=''}}
catch{$('#pb').innerHTML=`<div class="logo">${brand()}</div><div class="empty"><div>${ico('ban',54)}</div><h3>Enlace no disponible</h3></div><a id="hm">Ir a Storcloud</a>`;$('#hm').onclick=()=>{location.hash=''}}}

document.addEventListener('click',e=>{$('.pop')?.remove();const a=e.target.closest('[data-a]');if(a&&act[a.dataset.a])Promise.resolve(act[a.dataset.a](a.dataset.id,a,e)).catch(x=>toast(em(x),1))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.authb')&&$('#sub'))$('#sub').click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='srt'){S.sort=e.target.value;renderList()}else if(i==='th')setTheme(e.target.checked);else if(i==='nt')localStorage.setItem('mc-notif',e.target.checked?'1':'0')});
$('#fi').addEventListener('change',e=>{if(S.user)upload(e.target.files);e.target.value=''});
['dragover','dragleave','drop'].forEach(t=>addEventListener(t,e=>{if(!S.user||(S.view!=='files'&&S.view!=='dash'))return;e.preventDefault();document.body.classList.toggle('drag',t==='dragover');if(t==='drop'&&e.dataTransfer.files.length)upload(e.dataTransfer.files)}));
function route(){const h=location.hash;if(h.startsWith('#/s/'))return pub(h.slice(4).split('/')[0]);if(S.user===undefined)return;if(S.user&&S.gate)return verifyPage();S.user?shell():authPages()}
addEventListener('hashchange',route);
async function ensureProfile(u){try{const r=doc(db,'users',u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{name:S.pendingName||u.displayName||(u.email?u.email.split('@')[0]:u.phoneNumber)||'Usuario',email:u.email||'',quota:QUOTA,photo:u.photoURL||'',createdAt:serverTimestamp()})}catch(e){toast(em(e),1)}}
let unsub=[];
onAuthStateChanged(auth,u=>{unsub.forEach(f=>f());unsub=[];Object.assign(S,{user:u,files:[],shares:[],profile:null,loaded:false,parent:'root',q:'',urls:{},page:'landing',gate:!!(u&&u.providerData.some(p=>p.providerId==='password')&&!u.emailVerified),swept:false});
if(u&&!S.gate){ensureProfile(u);S.view='dash';unsub=[onSnapshot(doc(db,'users',u.uid),d=>{S.profile=d.data()||null;refresh()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'files'),where('ownerId','==',u.uid)),s=>{S.files=s.docs.map(mp);S.loaded=true;refresh();sweep()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'shares'),where('ownerId','==',u.uid)),s=>{S.shares=s.docs.map(mp);refresh()},e=>toast(em(e),1))]}
route()});

</script></body></html>
