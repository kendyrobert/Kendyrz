@property --a{syntax:"<angle>";inherits:false;initial-value:360deg}
.lgo{display:inline-block;width:36px;height:36px;flex:none;background:var(--logo) center/contain no-repeat}
.ld{display:inline-block;width:var(--s,56px);height:var(--s,56px);flex:none;position:relative}
.ld i{position:absolute;inset:0;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 3px 10px rgba(59,130,246,.45));transform-origin:50% 50%;animation:ldr 1.8s cubic-bezier(.45,0,.25,1) infinite}
.pm .ld i{-webkit-mask-image:conic-gradient(from 0deg,#000 var(--a),transparent calc(var(--a) + .6deg));mask-image:conic-gradient(from 0deg,#000 var(--a),transparent calc(var(--a) + .6deg));animation:ldm 2.2s cubic-bezier(.45,0,.25,1) infinite}
@keyframes ldr{0%{transform:rotate(-180deg) scale(.35);opacity:0}45%{opacity:1}70%{transform:rotate(0) scale(1);opacity:1}86%{transform:rotate(0) scale(1.07)}100%{transform:rotate(0) scale(1);opacity:0}}
@keyframes ldm{0%{--a:0deg;transform:rotate(-200deg) scale(.55);opacity:1}62%{--a:360deg;transform:rotate(0) scale(1)}80%{--a:360deg;transform:scale(1.07);opacity:1}100%{--a:360deg;transform:scale(1);opacity:0}}
.load{display:grid;place-items:center;height:100vh;animation:none}
.ldw{grid-column:1/-1;display:grid;place-items:center;padding:18px 0}
@media (prefers-reduced-motion:reduce){.ld i,.pm .ld i{animation:none;-webkit-mask-image:none;mask-image:none;opacity:.9}}
@keyframes pu{to{transform:scale(1.2);opacity:.5}}
.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}
.authw{display:grid;place-items:center;min-height:100vh;padding:20px}
.authb{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px;box-shadow:var(--sh)}
.authb h2{margin:14px 0 2px}
.authb .er{min-height:22px;font-size:14px}
.lk{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:14px}
#side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:18px;z-index:30;transition:.25s}
#side nav{display:flex;flex-direction:column;gap:4px;flex:1}
#side nav a{padding:12px 14px;border-radius:12px;color:var(--tx)}
#side nav a:hover{background:var(--bd)}
#side nav a.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.meter{padding:12px;border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.bar.big{height:14px}
.mainw{margin-left:250px}
.top{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 24px 14px;position:sticky;top:0;background:var(--bg);z-index:10}
.sp{flex:1}
.burger{display:none}
main{padding:8px 24px 110px;max-width:1200px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:inline-grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:64px;height:64px;font-size:26px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin-bottom:8px}
.card label{display:block;margin-top:10px;color:var(--mu);font-size:13px}
.sw{display:flex!important;gap:10px;align-items:center;color:var(--tx)!important;font-size:15px!important;margin:12px 0!important}
.hi{display:flex;gap:14px;align-items:center;margin:8px 0 18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.tb{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{width:180px;margin:0}
.tools select{width:auto;margin:0}
.tools .btn{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.it{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;cursor:pointer;transition:.2s;animation:in .25s}
@keyframes in{from{opacity:0;transform:scale(.97)}}
.it:hover{border-color:var(--ac)}
.it.sel{border-color:var(--ac);background:#0b817622}
.grid .it{padding:10px}
.grid .th{height:110px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:46px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{font-size:12px;color:var(--mu)}

function prog(name,size){const r=document.createElement('div');r.className='up';r.innerHTML=`<div class="hd">${LD(26)}<div><b></b><small>${sz(size)}</small></div><button class="cx" type="button" aria-label="Cancelar subida">Cancelar</button></div><div class="bar"><i></i></div><small class="s"></small>`;r.querySelector('b').textContent=name;$('#ups').append(r);const i=r.querySelector('i'),s=r.querySelector('.s'),cx=r.querySelector('.cx');s.textContent='Subiendo… 0%';
return{cancel:fn=>{cx.onclick=()=>{cx.disabled=true;fn()}},cancelled:()=>{s.textContent='Subida cancelada';r.classList.add('bad');cx.remove();r.querySelector('.ld')?.remove();setTimeout(()=>r.remove(),3000)},set:p=>{i.style.width=p+'%';s.textContent=`Subiendo ${p}%`},ok:()=>{cx.remove();r.querySelector('.ld')?.remove();i.style.width='100%';s.textContent='Archivo subido correctamente';r.classList.add('ok');setTimeout(()=>r.remove(),4000)},err:m=>{cx.remove();r.querySelector('.ld')?.remove();s.textContent=m;r.classList.add('bad');setTimeout(()=>r.remove(),8000)}}}
function cld(file,onp,ctl){return new Promise((ok,ko)=>{const x=new XMLHttpRequest(),b=new FormData();if(ctl)ctl.x=x;x.onabort=()=>ko(Object.assign(new Error('Subida cancelada'),{cancelled:true}));b.append('file',file);b.append('upload_preset',CLOUD_PRESET);x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);x.upload.onprogress=e=>e.lengthComputable&&onp&&onp(Math.round(e.loaded/e.total*100));x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status===200&&j.secure_url?ok(j):ko(new Error(j.error?.message||'Cloudinary rechazó el archivo'))};x.onerror=()=>ko(new Error('Error de red al subir'));x.send(b)})}
function upload(list){const parent=S.parent,u=S.user.uid;let tot=used();[...list].forEach(async f=>{if(!f.size){toast(`${f.name}: no se pueden subir carpetas ni archivos vacíos`,1);return}
if(tot+f.size>quota()){toast('No tienes suficiente almacenamiento.',1);return}tot+=f.size;const p=prog(f.name,f.size),ctl={};p.cancel(()=>ctl.x&&ctl.x.abort());

document.addEventListener('change',e=>{const i=e.target.id;if(i==='srt'){S.sort=e.target.value;renderList()}else if(i==='th')setTheme(e.target.checked);else if(i==='nt')localStorage.setItem('mc-notif',e.target.checked?'1':'0')});
$('#fi').addEventListener('change',e=>{if(S.user)upload(e.target.files);e.target.value=''});
['dragover','dragleave','drop'].forEach(t=>addEventListener(t,e=>{if(!S.user||(S.view!=='files'&&S.view!=='dash'))return;e.preventDefault();document.body.classList.toggle('drag',t==='dragover');if(t==='drop'&&e.dataTransfer.files.length)upload(e.dataTransfer.files)}));
function route(){const h=location.hash;if(h.startsWith('#/s/'))return pub(h.slice(4).split('/')[0]);if(S.user===undefined)return;if(S.user&&S.gate)return verifyPage();S.user?shell():authPages()}
addEventListener('hashchange',route);
async function ensureProfile(u){try{const r=doc(db,'users',u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{name:S.pendingName||u.displayName||(u.email?u.email.split('@')[0]:u.phoneNumber)||'Usuario',email:u.email||'',quota:QUOTA,photo:u.photoURL||'',createdAt:serverTimestamp()})}catch(e){toast(em(e),1)}}
let unsub=[];
onAuthStateChanged(auth,u=>{unsub.forEach(f=>f());unsub=[];Object.assign(S,{user:u,files:[],shares:[],profile:null,loaded:false,parent:'root',q:'',urls:{},page:'landing',gate:!!(u&&u.providerData.some(p=>p.providerId==='password')&&!u.emailVerified),swept:false});
if(u&&!S.gate){ensureProfile(u);S.view='dash';unsub=[onSnapshot(doc(db,'users',u.uid),d=>{S.profile=d.data()||null;refresh()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'files'),where('ownerId','==',u.uid)),s=>{S.files=s.docs.map(mp);S.loaded=true;refresh();sweep()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'shares'),where('ownerId','==',u.uid)),s=>{S.shares=s.docs.map(mp);refresh()},e=>toast(em(e),1))]}
route()});

</script></body></html>
