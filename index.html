<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Fire Profile Analyzer – Analiza perfiles por UID</title>
<meta name="description" content="Consulta estadísticas de jugadores de Free Fire por UID y región. Guarda favoritos, revisa tu historial y compara perfiles.">
<link rel="canonical" href="https://kendygta.vercel.app">
<meta property="og:title" content="Free Fire Profile Analyzer">
<meta property="og:description" content="Analiza perfiles de Free Fire por UID y región.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0d0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a0a;--card:#171212;--card2:#1f1717;--line:#33261f;--txt:#f3ece6;--mut:#a89a90;--red:#ff3d2e;--ora:#ff8a1f;--gold:#ffc83d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1000px 420px at 50% -8%,#3a130d,transparent 70%),var(--bg);color:var(--txt);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Chakra Petch",Inter,sans-serif}
a{color:var(--ora)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d0a0aee;backdrop-filter:blur(8px);z-index:10}
.logo{font-weight:700;font-size:19px;color:var(--gold);text-decoration:none;white-space:nowrap}
.logo span{color:var(--red)}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
nav a.nl{color:var(--txt);text-decoration:none;padding:6px 8px;border-radius:8px;font-size:14px}
nav a.nl:hover{background:var(--card2)}
button,.btn{background:linear-gradient(90deg,var(--red),var(--ora));color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 15px Inter,sans-serif;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:920px;margin:0 auto;padding:16px}
.hero{padding:40px 0 18px;text-align:center}
.hero h1{font-size:clamp(30px,8vw,54px);line-height:1.05;margin:0 0 12px}
.hero h1 b{background:linear-gradient(90deg,var(--red),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 auto 22px;max-width:540px}
form.search{display:grid;gap:10px;grid-template-columns:1fr;max-width:600px;margin:auto}
@media(min-width:640px){form.search{grid-template-columns:1fr 130px auto}}
input,select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:16px;width:100%;font-family:inherit}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h2,.card h3{margin:0 0 10px;color:var(--gold)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat small{color:var(--mut);display:block;font-size:13px}
.stat b{font-size:21px;font-family:"Chakra Petch",sans-serif}
.na{color:var(--mut);font-size:14px;font-weight:400;font-family:Inter,sans-serif}
.bar{height:8px;background:#0d0a0a;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.msg{border-left:4px solid var(--ora);background:var(--card2);padding:12px 14px;border-radius:8px;margin:14px 0}
.msg.err{border-color:var(--red)}
.sk{height:74px;border-radius:10px;background:linear-gradient(90deg,#171212,#271c1a,#171212);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.who{display:flex;gap:14px;align-items:center}
.ava{width:68px;height:68px;border-radius:14px;background:var(--card2);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;color:var(--mut);font-size:12px}
.lvl{display:inline-block;background:linear-gradient(90deg,var(--ora),var(--gold));color:#1a0d00;font-weight:700;border-radius:8px;padding:2px 10px;font-family:"Chakra Petch",sans-serif}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--gold);font-family:"Chakra Petch",sans-serif}
details{border-bottom:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:600}
details p{color:var(--mut);margin:8px 0 0}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;max-width:380px;width:92%}
dialog::backdrop{background:#000a}
footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 16px;color:var(--mut);font-size:14px;text-align:center}
.list-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header>
  <a class="logo" href="#/">FF <span>Profile</span> Analyzer</a>
  <nav aria-label="Principal">
    <a class="nl" href="#/comparar">Comparar</a>
    <a class="nl hide" id="nav-fav" href="#/favoritos">Favoritos</a>
    <a class="nl hide" id="nav-his" href="#/historial">Historial</a>
    <button class="ghost sm" id="btn-login">Iniciar sesión</button>
    <button class="ghost sm hide" id="btn-logout">Cerrar sesión</button>
  </nav>
</header>

<main id="app"></main>

<footer>
  <p>Free Fire Profile Analyzer es una herramienta independiente. No está afiliada a Garena ni a Free Fire. Free Fire es marca de sus propietarios.</p>
  <p><a href="#/privacidad">Privacidad</a> · <a href="mailto: robertcreativo23@gmail.com">Contacto</a></p>
</footer>

<dialog id="dlg-auth">
  <form method="dialog" id="auth-form">
    <h2 id="auth-title" style="margin-top:0;color:var(--gold)">Iniciar sesión</h2>
    <label for="a-mail">Correo electrónico</label>
    <input id="a-mail" type="email" autocomplete="email" required>
    <label for="a-pass">Contraseña</label>
    <input id="a-pass" type="password" autocomplete="current-password" minlength="6">
    <p id="a-err" class="msg err hide" role="alert"></p>
    <div style="display:grid;gap:8px;margin-top:14px">
      <button type="button" id="a-submit">Entrar</button>
      <button type="button" class="ghost" id="a-google">Continuar con Google</button>
      <button type="button" class="ghost" id="a-toggle">Crear una cuenta</button>
      <button type="button" class="ghost" id="a-reset">Olvidé mi contraseña</button>
      <button type="button" class="ghost" id="a-close">Cerrar</button>
    </div>
  </form>
</dialog>

<script type="module">
/* ========= CONFIGURACIÓN (rellena estos valores) ========= */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAWr9YM0YAG0mx0SEk3qNEhjeS1MOu_2lg",
  authDomain: "kendy-57bcd.firebaseapp.com",
  projectId: "kendy-57bcd",
  storageBucket: "kendy-57bcd.firebasestorage.app",
  messagingSenderId: "678778497788",
  appId: "1:678778497788:web:1e26e4c5be5c60f2f98579",
  measurementId: "G-KKW9TV2H8J"
};
// URL base de TU backend (por ejemplo "https://api.tudominio.com"). Vacío = backend no configurado.
const API_BASE = "";
/* ========================================================= */

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NA = '<span class="na">No disponible</span>';
const num = v => (typeof v === "number" && isFinite(v)) ? v.toLocaleString("es") : NA;
const fbOK = !FIREBASE_CONFIG.apiKey.startsWith("TU_");

/* ---------- Firebase (carga dinámica) ---------- */
let A = null, D = null, auth = null, db = null, user = null;
async function initFirebase() {
  if (!fbOK) return;
  try {
    const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
    const appM = await import(base + "firebase-app.js");
    A = await import(base + "firebase-auth.js");
    D = await import(base + "firebase-firestore.js");
    const fa = appM.initializeApp(FIREBASE_CONFIG);
    auth = A.getAuth(fa);
    db = D.getFirestore(fa);
    await A.setPersistence(auth, A.browserLocalPersistence);
    A.onAuthStateChanged(auth, u => { user = u; paintNav(); route(); });
  } catch (e) { console.error(e); }
}
function paintNav() {
  $("#btn-login").classList.toggle("hide", !!user);
  $("#btn-logout").classList.toggle("hide", !user);
  $("#nav-fav").classList.toggle("hide", !user);
  $("#nav-his").classList.toggle("hide", !user);
}

/* ---------- API del backend ---------- */
async function api(path) {
  if (!API_BASE) throw new Error("NO_BACKEND");
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(API_BASE + path, { signal: ctl.signal });
    if (r.status === 429) throw new Error("RATE");
    if (r.status === 404) throw new Error("NOT_FOUND");
    if (r.status === 501 || r.status === 503) throw new Error("PROVIDER");
    if (!r.ok) throw new Error("HTTP_" + r.status);
    return await r.json();
  } catch (e) {
    if (e.name === "AbortError") throw new Error("TIMEOUT");
    throw e;
  } finally { clearTimeout(t); }
}
function errText(e) {
  const m = {
    NO_BACKEND: "El backend todavía no está configurado. Define API_BASE en este archivo cuando tengas tu servidor.",
    RATE: "Has hecho demasiadas consultas. Espera un momento e inténtalo de nuevo.",
    NOT_FOUND: "No se encontró ese jugador con el UID y la región indicados.",
    PROVIDER: "El servicio de estadísticas no está disponible o no tiene una API autorizada conectada.",
    TIMEOUT: "El servidor tardó demasiado en responder. Inténtalo otra vez."
  };
  return m[e.message] || "No se pudo completar la consulta. Revisa tu conexión e inténtalo de nuevo.";
}
let regionsCache = null;
async function getRegions() {
  if (regionsCache) return regionsCache;
  try { const r = await api("/api/regions"); regionsCache = Array.isArray(r.regions) ? r.regions : []; }
  catch { regionsCache = []; }
  return regionsCache;
}
const validUid = u => /^\d{5,14}$/.test(u);

/* ---------- Componentes ---------- */
function regionSelect(id, regions) {
  if (!regions.length) return `<select id="${id}" disabled aria-label="Región"><option>Sin regiones</option></select>`;
  return `<select id="${id}" aria-label="Región">${regions.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select>`;
}
function skeleton() { return `<div class="card"><div class="sk"></div></div><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`; }
function pct(a, b) { return (typeof a === "number" && typeof b === "number" && b > 0) ? (a / b * 100) : null; }
function block(title, o) {
  o = o || {};
  const wr = pct(o.wins, o.matches);
  const kpm = (typeof o.kills === "number" && typeof o.matches === "number" && o.matches > 0) ? o.kills / o.matches : null;
  return `<div class="stat"><small>${esc(title)}</small>
    <div class="grid" style="margin-top:6px">
      <div><small>Partidas</small><b>${num(o.matches)}</b></div>
      <div><small>Victorias</small><b>${num(o.wins)}</b></div>
      <div><small>Eliminaciones</small><b>${num(o.kills)}</b></div>
      <div><small>% victorias (calculado)</small><b>${wr === null ? NA : wr.toFixed(1) + "%"}</b></div>
      <div><small>Elim. por partida (calculado)</small><b>${kpm === null ? NA : kpm.toFixed(2)}</b></div>
    </div>
    ${wr === null ? "" : `<div class="bar" aria-hidden="true"><i style="width:${Math.min(100, wr)}%"></i></div>`}</div>`;
}
function modeCard(title, m) {
  m = m || {};
  const has = m.career || m.ranked || m.normal;
  return `<section class="card"><h2>${esc(title)}</h2>${has
    ? `<div class="grid" style="grid-template-columns:1fr">${m.career ? block("Carrera", m.career) : ""}${m.ranked ? block("Clasificatoria", m.ranked) : ""}${m.normal ? block("Normal", m.normal) : ""}</div>`
    : `<p>${NA}</p>`}</section>`;
}
function profileHTML(d) {
  const p = d.player || {};
  const clan = p.clan && p.clan.name;
  return `<section class="card">
    <div class="row"><div class="who">
      ${p.avatarUrl ? `<img class="ava" src="${esc(p.avatarUrl)}" alt="Avatar de ${esc(p.nickname)}" loading="lazy">` : `<div class="ava">Sin avatar</div>`}
      <div><h2 style="margin:0">${p.nickname ? esc(p.nickname) : NA}</h2>
        <div>UID <b>${esc(p.uid)}</b> <button class="ghost sm" id="copy-uid">Copiar UID</button></div>
        <div>${typeof p.level === "number" ? `<span class="lvl">Nv. ${p.level}</span>` : ""} <span class="na">Región: ${p.region ? esc(p.region) : "No disponible"}</span></div>
      </div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost sm" id="btn-fav">★ Favorito</button>
        <button class="sm" id="btn-card">Tarjeta para compartir</button>
      </div></div>
    <div class="grid" style="margin-top:12px">
      <div class="stat"><small>Experiencia</small><b>${num(p.exp)}</b></div>
      <div class="stat"><small>Clan</small><b>${clan ? esc(clan) : NA}</b></div>
      <div class="stat"><small>Firma</small><b style="font-size:15px">${p.signature ? esc(p.signature) : NA}</b></div>
    </div>
    ${d.fetchedAt ? `<p class="na">Datos obtenidos el ${esc(new Date(d.fetchedAt).toLocaleString("es"))}${d.fromCache ? " (desde caché)" : ""}.</p>` : ""}
  </section>${modeCard("Battle Royale", d.br)}${modeCard("Duelo de Escuadras", d.cs)}`;
}

/* ---------- Páginas ---------- */
async function pageHome() {
  document.title = "Free Fire Profile Analyzer – Analiza perfiles por UID";
  const regions = await getRegions();
  app.innerHTML = `
  <section class="hero">
    <h1>Free Fire <b>Profile Analyzer</b></h1>
    <p>Escribe el UID de un jugador, elige la región y revisa sus estadísticas reales. Sin cuenta y sin contraseñas.</p>
    <form class="search" id="f-search">
      <input id="uid" inputmode="numeric" placeholder="UID del jugador" aria-label="UID del jugador" required>
      ${regionSelect("region", regions)}
      <button type="submit">Analizar perfil</button>
    </form>
    ${regions.length ? "" : `<p class="na">Las regiones se cargan desde tu backend. Aún no hay ninguna disponible.</p>`}
  </section>
  <div id="result"></div>
  <section class="card"><h2>Qué puedes hacer</h2>
    <div class="grid">
      <div class="stat"><b>Analizar</b><small>Datos del jugador y estadísticas de Battle Royale y Duelo de Escuadras.</small></div>
      <div class="stat"><b>Comparar</b><small>Dos perfiles lado a lado.</small></div>
      <div class="stat"><b>Guardar</b><small>Favoritos e historial con tu cuenta.</small></div>
      <div class="stat"><b>Compartir</b><small>Tarjeta en imagen con el resumen.</small></div>
    </div></section>
  <section class="card"><h2>Preguntas frecuentes</h2>
    <details><summary>¿Dónde encuentro mi UID?</summary><p>En tu perfil dentro del juego, bajo tu apodo.</p></details>
    <details><summary>¿Piden mi contraseña?</summary><p>Nunca. Solo necesitas el UID y la región.</p></details>
    <details><summary>¿Por qué aparece “No disponible”?</summary><p>Solo mostramos los datos que el servicio devuelve. Si un dato no llega, no lo inventamos.</p></details>
    <details><summary>¿Hace falta cuenta?</summary><p>No para consultar. Sí para favoritos e historial.</p></details>
  </section>`;
  $("#f-search").addEventListener("submit", e => { e.preventDefault(); runSearch($("#uid").value.trim(), $("#region").value); });
}

let lastData = null;
async function runSearch(uid, region) {
  const out = $("#result");
  if (!validUid(uid)) { out.innerHTML = `<p class="msg err" role="alert">El UID debe tener solo números (entre 5 y 14 dígitos).</p>`; return; }
  out.innerHTML = skeleton();
  try {
    const d = await api(`/api/player?uid=${encodeURIComponent(uid)}&region=${encodeURIComponent(region)}`);
    lastData = d;
    out.innerHTML = profileHTML(d);
    document.title = `Perfil ${d.player?.nickname || uid} – Free Fire Profile Analyzer`;
    $("#copy-uid").onclick = async () => { try { await navigator.clipboard.writeText(String(d.player?.uid ?? uid)); $("#copy-uid").textContent = "Copiado"; } catch { $("#copy-uid").textContent = "No se pudo copiar"; } };
    $("#btn-fav").onclick = () => addFavorite(d, uid, region);
    $("#btn-card").onclick = () => shareCard(d);
    saveHistory(d, uid, region);
  } catch (e) { out.innerHTML = `<p class="msg err" role="alert">${esc(errText(e))}</p>`; }
}

async function pageCompare() {
  document.title = "Comparar perfiles – Free Fire Profile Analyzer";
  const regions = await getRegions();
  app.innerHTML = `<h1 style="font-family:'Chakra Petch'">Comparar perfiles</h1>
  <section class="card"><div class="grid">
    <div><label for="u1">UID jugador 1</label><input id="u1" inputmode="numeric"><label for="r1">Región</label>${regionSelect("r1", regions)}</div>
    <div><label for="u2">UID jugador 2</label><input id="u2" inputmode="numeric"><label for="r2">Región</label>${regionSelect("r2", regions)}</div>
  </div><p><button id="go-cmp">Comparar</button></p></section><div id="cmp"></div>`;
  $("#go-cmp").onclick = async () => {
    const u1 = $("#u1").value.trim(), u2 = $("#u2").value.trim(), out = $("#cmp");
    if (!validUid(u1) || !validUid(u2)) { out.innerHTML = `<p class="msg err" role="alert">Escribe dos UID válidos (solo números).</p>`; return; }
    out.innerHTML = skeleton();
    try {
      const [a, b] = await Promise.all([api(`/api/player?uid=${u1}&region=${encodeURIComponent($("#r1").value)}`), api(`/api/player?uid=${u2}&region=${encodeURIComponent($("#r2").value)}`)]);
      const ca = a.br?.career, cb = b.br?.career;
      if (!ca || !cb) { out.innerHTML = `<p class="msg">Uno de los dos perfiles no tiene estadísticas de carrera disponibles, así que no se puede comparar.</p>`; return; }
      const row = (n, x, y) => `<tr><td>${n}</td><td>${num(x)}</td><td>${num(y)}</td></tr>`;
      const f = (o, k) => o?.[k];
      const w = (o) => { const v = pct(o.wins, o.matches); return v === null ? null : +v.toFixed(1); };
      out.innerHTML = `<section class="card"><table><tr><th>Battle Royale (carrera)</th><th>${esc(a.player?.nickname || u1)}</th><th>${esc(b.player?.nickname || u2)}</th></tr>
        ${row("Nivel", a.player?.level, b.player?.level)}${row("Partidas", f(ca, "matches"), f(cb, "matches"))}${row("Victorias", f(ca, "wins"), f(cb, "wins"))}${row("Eliminaciones", f(ca, "kills"), f(cb, "kills"))}${row("% victorias (calculado)", w(ca), w(cb))}</table></section>`;
    } catch (e) { out.innerHTML = `<p class="msg err" role="alert">${esc(errText(e))}</p>`; }
  };
}

function needAuth(render) {
  if (!fbOK) { app.innerHTML = `<p class="msg">Firebase no está configurado. Rellena FIREBASE_CONFIG en este archivo para usar cuentas.</p>`; return false; }
  if (!user) { app.innerHTML = `<p class="msg">Inicia sesión para ver esta página.</p><button id="go-login">Iniciar sesión</button>`; $("#go-login").onclick = openAuth; return false; }
  return true;
}
async function pageFavs() {
  document.title = "Favoritos – Free Fire Profile Analyzer";
  if (!needAuth()) return;
  app.innerHTML = `<h1 style="font-family:'Chakra Petch'">Favoritos</h1><div id="lst">${skeleton()}</div>`;
  try {
    const s = await D.getDocs(D.query(D.collection(db, "favorites"), D.where("ownerUid", "==", user.uid)));
    const items = s.docs.map(d => ({ id: d.id, ...d.data() }));
    $("#lst").innerHTML = items.length ? `<section class="card">${items.map(i => `<div class="list-item"><span><b>${esc(i.nickname || i.uid)}</b> <span class="na">UID ${esc(i.uid)} · ${esc(i.region)}</span></span><span><button class="ghost sm" data-open="${esc(i.uid)}|${esc(i.region)}">Abrir</button> <button class="ghost sm" data-del="${esc(i.id)}">Quitar</button></span></div>`).join("")}</section>` : `<p class="msg">Todavía no tienes favoritos. Guarda uno desde el resultado de una consulta.</p>`;
    $("#lst").onclick = async e => {
      const o = e.target.dataset.open, x = e.target.dataset.del;
      if (o) { const [u, r] = o.split("|"); await pageHome(); $("#uid").value = u; if ($("#region")) $("#region").value = r; runSearch(u, r); }
      if (x) { await D.deleteDoc(D.doc(db, "favorites", x)); pageFavs(); }
    };
  } catch { $("#lst").innerHTML = `<p class="msg err">No se pudieron cargar los favoritos.</p>`; }
}
async function pageHistory() {
  document.title = "Historial – Free Fire Profile Analyzer";
  if (!needAuth()) return;
  app.innerHTML = `<h1 style="font-family:'Chakra Petch'">Historial</h1><div id="lst">${skeleton()}</div>`;
  try {
    const s = await D.getDocs(D.query(D.collection(db, "searchHistory"), D.where("userUid", "==", user.uid), D.limit(100)));
    const items = s.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).slice(0, 50);
    $("#lst").innerHTML = items.length ? `<section class="card">${items.map(i => `<div class="list-item"><span><b>${esc(i.nickname || i.uid)}</b> <span class="na">UID ${esc(i.uid)} · ${esc(i.region)}${i.createdAt ? " · " + esc(new Date(i.createdAt.seconds * 1000).toLocaleString("es")) : ""}</span></span></div>`).join("")}</section>` : `<p class="msg">Tu historial está vacío.</p>`;
  } catch { $("#lst").innerHTML = `<p class="msg err">No se pudo cargar el historial.</p>`; }
}
function pagePrivacy() {
  document.title = "Privacidad – Free Fire Profile Analyzer";
  app.innerHTML = `<h1 style="font-family:'Chakra Petch'">Privacidad</h1><section class="card">
  <p>Esta web no pide contraseñas de Free Fire ni las guarda. Para consultar un perfil solo se usan el UID y la región.</p>
  <p>Si creas una cuenta, guardamos tu correo y tus favoritos e historial, visibles únicamente para ti.</p>
  <p>Edita este texto con tus datos legales reales antes de publicar.</p></section>`;
}

/* ---------- Favoritos / historial / tarjeta ---------- */
async function addFavorite(d, uid, region) {
  const b = $("#btn-fav");
  if (!user) { openAuth(); return; }
  try {
    await D.addDoc(D.collection(db, "favorites"), { ownerUid: user.uid, uid: String(d.player?.uid ?? uid), region, nickname: d.player?.nickname || null, savedAt: D.serverTimestamp() });
    b.textContent = "★ Guardado";
  } catch { b.textContent = "Error al guardar"; }
}
async function saveHistory(d, uid, region) {
  if (!user || !db) return;
  try { await D.addDoc(D.collection(db, "searchHistory"), { userUid: user.uid, uid: String(uid), region, nickname: d.player?.nickname || null, createdAt: D.serverTimestamp() }); } catch {}
}
function shareCard(d) {
  const p = d.player || {}, c = d.br?.career || {};
  const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 566;
  const x = cv.getContext("2d");
  const g = x.createLinearGradient(0, 0, 1080, 566); g.addColorStop(0, "#2a0e0a"); g.addColorStop(1, "#0d0a0a");
  x.fillStyle = g; x.fillRect(0, 0, 1080, 566);
  x.fillStyle = "#ff8a1f"; x.fillRect(0, 0, 14, 566);
  x.fillStyle = "#ffc83d"; x.font = "700 54px sans-serif"; x.fillText(String(p.nickname || "Jugador"), 60, 120);
  x.fillStyle = "#a89a90"; x.font = "28px sans-serif"; x.fillText("UID " + (p.uid ?? "—") + (p.region ? "  ·  " + p.region : ""), 60, 170);
  const t = v => (typeof v === "number" ? v.toLocaleString("es") : "No disponible");
  const items = [["Nivel", p.level], ["Partidas", c.matches], ["Victorias", c.wins], ["Eliminaciones", c.kills]];
  items.forEach((it, i) => {
    const px = 60 + i * 250;
    x.fillStyle = "#171212"; x.fillRect(px, 240, 230, 150);
    x.fillStyle = "#a89a90"; x.font = "24px sans-serif"; x.fillText(it[0], px + 18, 285);
    x.fillStyle = "#f3ece6"; x.font = "700 " + (typeof it[1] === "number" ? 44 : 24) + "px sans-serif"; x.fillText(t(it[1]), px + 18, 350);
  });
  x.fillStyle = "#a89a90"; x.font = "24px sans-serif"; x.fillText("Free Fire Profile Analyzer", 60, 520);
  const a = document.createElement("a"); a.download = `perfil-${p.uid || "ff"}.png`; a.href = cv.toDataURL("image/png"); a.click();
}

/* ---------- Autenticación ---------- */
const dlg = $("#dlg-auth"); let registerMode = false;
function openAuth() {
  if (!fbOK) { alert("Firebase no está configurado. Rellena FIREBASE_CONFIG en el archivo."); return; }
  $("#a-err").classList.add("hide"); dlg.showModal();
}
function authErr(m) { const e = $("#a-err"); e.textContent = m; e.classList.remove("hide"); }
function authMsg(e) {
  const c = e.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Correo o contraseña incorrectos.";
  if (c.includes("email-already")) return "Ese correo ya tiene una cuenta. Inicia sesión.";
  if (c.includes("weak-password")) return "La contraseña debe tener al menos 6 caracteres.";
  if (c.includes("invalid-email")) return "El correo no es válido.";
  return "No se pudo completar la acción. Inténtalo de nuevo.";
}
$("#btn-login").onclick = openAuth;
$("#a-close").onclick = () => dlg.close();
$("#a-toggle").onclick = () => {
  registerMode = !registerMode;
  $("#auth-title").textContent = registerMode ? "Crear cuenta" : "Iniciar sesión";
  $("#a-submit").textContent = registerMode ? "Crear cuenta" : "Entrar";
  $("#a-toggle").textContent = registerMode ? "Ya tengo cuenta" : "Crear una cuenta";
};
$("#a-submit").onclick = async () => {
  const m = $("#a-mail").value.trim(), p = $("#a-pass").value;
  if (!m || !p) return authErr("Escribe tu correo y tu contraseña.");
  try {
    if (registerMode) {
      const c = await A.createUserWithEmailAndPassword(auth, m, p);
      await D.setDoc(D.doc(db, "users", c.user.uid), { displayName: c.user.displayName || null, avatarUrl: null, createdAt: D.serverTimestamp(), preferences: {} });
    } else await A.signInWithEmailAndPassword(auth, m, p);
    dlg.close();
  } catch (e) { authErr(authMsg(e)); }
};
$("#a-google").onclick = async () => {
  try {
    const c = await A.signInWithPopup(auth, new A.GoogleAuthProvider());
    await D.setDoc(D.doc(db, "users", c.user.uid), { displayName: c.user.displayName || null, avatarUrl: c.user.photoURL || null, createdAt: D.serverTimestamp(), preferences: {} }, { merge: true });
    dlg.close();
  } catch (e) { authErr(authMsg(e)); }
};
$("#a-reset").onclick = async () => {
  const m = $("#a-mail").value.trim();
  if (!m) return authErr("Escribe tu correo y pulsa de nuevo.");
  try { await A.sendPasswordResetEmail(auth, m); authErr("Te enviamos un correo para restablecer la contraseña."); } catch (e) { authErr(authMsg(e)); }
};
$("#btn-logout").onclick = async () => { await A.signOut(auth); location.hash = "#/"; };

/* ---------- Router ---------- */
function route() {
  const h = location.hash || "#/";
  if (h.startsWith("#/comparar")) return pageCompare();
  if (h.startsWith("#/favoritos")) return pageFavs();
  if (h.startsWith("#/historial")) return pageHistory();
  if (h.startsWith("#/privacidad")) return pagePrivacy();
  return pageHome();
}
window.addEventListener("hashchange", route);
route();
initFirebase();
</script>
