<!DOCTYPE html>
<!--
MEDIACLOUD - CONFIGURACIÓN (una sola vez)
1) Firebase > Authentication > Método de acceso: habilita "Correo/contraseña" y "Google".
   Authentication > Configuración > Dominios autorizados: añade el dominio donde publiques (localhost ya viene).
2) Firebase > Firestore Database > Crear base de datos > pestaña Reglas: pega esto y Publica:

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signed() { return request.auth != null; }
    function isAdmin() { return signed() && exists(/databases/$(database)/documents/admins/$(request.auth.uid)); }
    match /users/{u} {
      allow read: if signed() && (request.auth.uid == u || isAdmin());
      allow create: if signed() && request.auth.uid == u
        && request.resource.data.keys().hasOnly(['name','email','quota','photo','createdAt'])
        && request.resource.data.quota == 10737418240;
      allow update: if signed() && request.auth.uid == u
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name','photo']);
    }
    match /files/{f} {
      allow read: if signed() && (resource.data.ownerId == request.auth.uid || isAdmin());
      allow create: if signed() && request.resource.data.ownerId == request.auth.uid;
      allow update: if signed() && resource.data.ownerId == request.auth.uid && request.resource.data.ownerId == request.auth.uid;
      allow delete: if signed() && resource.data.ownerId == request.auth.uid;
    }
    match /shares/{s} {
      allow get: if resource.data.active == true || (signed() && resource.data.ownerId == request.auth.uid);
      allow list: if signed() && (resource.data.ownerId == request.auth.uid || isAdmin());
      allow create: if signed() && request.resource.data.ownerId == request.auth.uid && request.resource.data.downloads == 0;
      allow update: if (signed() && resource.data.ownerId == request.auth.uid && request.resource.data.ownerId == request.auth.uid)
        || (resource.data.active == true
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['downloads'])
            && request.resource.data.downloads == resource.data.downloads + 1);
      allow delete: if signed() && resource.data.ownerId == request.auth.uid;
    }
    match /admins/{a} { allow read: if signed() && request.auth.uid == a; }
  }
}

3) Cloudinary > Settings > Upload > Upload presets: el preset "KendyR" debe estar en modo "Unsigned".
4) Abre esta página con http/https (python -m http.server 8000) o publícala; Google no funciona desde file://.
Firebase Storage NO se usa: los archivos van a Cloudinary.

return`<div class="tb"><div id="crumbs" class="crumbs"></div><div class="tools"><div class="sbox"><span>🔍</span><input id="q" type="search" placeholder="Buscar archivos y carpetas…" value="${esc(S.q)}"></div><select id="srt">${[['date','Fecha'],['name','Nombre'],['size','Tamaño'],['type','Tipo']].map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}</select><button class="ib" data-a="grid" title="Cambiar vista">${S.grid?'☰':'▦'}</button><button class="btn ghost" data-a="newf">📁 Carpeta</button></div></div><div class="chips">${chips.map(([k,l])=>`<button class="chip2${S.filter===k?' on':''}" data-a="flt" data-id="${k}">${l}</button>`).join('')}</div><div id="selbar"></div><div id="list"></div>`},
shared(){return S.shares.length?`<div class="list shr">${S.shares.map(s=>`<div class="it"><div class="th">${IC[ext(s.name)]||IC.other}</div><div class="in"><div class="nm">${esc(s.name)}</div><div class="mt">${s.active?'🟢 Activo':'⚪ Desactivado'} · ${s.downloads||0} descargas · ${sz(s.size)}</div></div><button class="btn ghost" data-a="qr" data-id="${s.id}">📱 QR</button><button class="btn ghost" data-a="cp" data-id="${s.id}">Copiar enlace</button><button class="btn ghost" data-a="tog" data-id="${s.id}">${s.active?'Desactivar':'Activar'}</button></div>`).join('')}</div>`:empty('Aún no compartes nada','Comparte un archivo desde el menú ⋮ de Mis archivos.',0)},
trash(){const a=S.files.filter(f=>f.trashed&&live(f)).sort((x,y)=>y.t-x.t);return`<div class="tb"><p class="mu">Lo que está en la papelera sigue ocupando espacio.</p>${a.length?'<button class="btn er" data-a="empty">Vaciar papelera</button>':''}</div>${!S.loaded?skel(4):a.length?`<div class="${S.grid?'grid':'list'}">${a.map(card).join('')}</div>`:empty('La papelera está vacía','Los archivos eliminados aparecerán aquí.',0)}`},
acct(){const p=S.profile||{},u=S.user;return`<div class="two"><div class="card"><h3>Perfil</h3><div class="hi"><span class="av big">${av()}</span><button class="btn ghost" data-a="photo">Cambiar foto</button></div><label>Nombre</label><input id="pn" value="${esc(p.name||u.displayName||'')}"><button class="btn" data-a="saven">Guardar nombre</button><p class="mu">Email: <b>${esc(u.email)}</b></p><p class="mu">Registro: <b>${fd(p.createdAt?.toMillis?.()||+u.metadata.createdAt)}</b></p><p class="mu">Espacio usado: <b>${sz(used())} / ${sz(quota())}</b></p></div><div class="card"><h3>Seguridad</h3><label>Nueva contraseña</label><input id="np" type="password" placeholder="Mínimo 8 caracteres, letras y números" autocomplete="new-password"><button class="btn" data-a="savep">Cambiar contraseña</button><br><button class="btn ghost" data-a="rst">Enviarme correo de recuperación</button></div><div class="card"><h3>Configuración</h3><label class="sw"><input type="checkbox" id="th" ${document.documentElement.dataset.theme==='dark'?'checked':''}> Tema oscuro</label><label class="sw"><input type="checkbox" id="nt" ${localStorage.getItem('mc-notif')!=='0'?'checked':''}> Notificaciones en pantalla</label><button class="btn er" data-a="out">Cerrar sesión</button></div></div>`}};
function renderMain(){const m=$('#main');if(!m)return;m.innerHTML=V[S.view]();if(S.view==='files')renderList();thumbs()}
function items(){let a=S.files.filter(f=>!f.trashed&&live(f));a=S.q?a.filter(f=>f.name.toLowerCase().includes(S.q.toLowerCase())):a.filter(f=>f.parent===S.parent);if(S.filter!=='all')a=a.filter(f=>!f.isFolder&&kind(f)===S.filter);
const k={name:(x,y)=>x.name.localeCompare(y.name),date:(x,y)=>y.t-x.t,size:(x,y)=>(y.size||0)-(x.size||0),type:(x,y)=>ext(x.name).localeCompare(ext(y.name))}[S.sort];return a.sort((x,y)=>(y.isFolder-x.isFolder)||k(x,y))}
function crumbs(){const c=[];let p=S.parent;while(p!=='root'){const f=byId(p);if(!f)break;c.unshift(f);p=f.parent}return['<a data-a="nav" data-id="root">Mis archivos</a>',...c.map(f=>`<a data-a="nav" data-id="${f.id}">${esc(f.name)}</a>`)].join(' › ')}
function renderList(){const L=$('#list');if(!L)return;$('#crumbs').innerHTML=S.q?`Resultados para «${esc(S.q)}»`:crumbs();
$('#selbar').innerHTML=S.sel.size?`<div class="selbar"><b>${S.sel.size} seleccionado(s)</b><button class="btn ghost" data-a="move">Mover</button><button class="btn er" data-a="trash">Eliminar</button><button class="btn ghost" data-a="unsel">✕</button></div>`:'';
const a=items();L.className=S.grid?'grid':'list';L.innerHTML=!S.loaded?'<div class="sk"></div>'.repeat(8):a.length?a.map(card).join(''):(S.q||S.filter!=='all')?empty('Sin resultados','Prueba con otra búsqueda o filtro.',0):empty();thumbs();usageUpd()}
function refresh(){if(!S.user||!$('#main'))return;usageUpd();S.view==='files'?renderList():renderMain()}
function thumbs(){$$('[data-th]').forEach(async el=>{try{el.innerHTML=`<img loading="lazy" alt="" src="${byId(el.dataset.th).url.replace('/upload/','/upload/c_fill,w_320,h_240,q_auto/')}">`}catch{}})}

/* ---------- Subidas ---------- */
function prog(name,size){const r=document.createElement('div');r.className='up';r.innerHTML=`<div><b></b><small>${sz(size)}</small></div><div class="bar"><i></i></div><small class="s"></small>`;r.querySelector('b').textContent=name;$('#ups').append(r);const i=r.querySelector('i'),s=r.querySelector('.s');s.textContent='Subiendo… 0%';
return{set:p=>{i.style.width=p+'%';s.textContent=`Subiendo ${p}%`},ok:()=>{i.style.width='100%';s.textContent='✓ Archivo subido correctamente';r.classList.add('ok');setTimeout(()=>r.remove(),4000)},err:m=>{s.textContent='⚠️ '+m;r.classList.add('bad');setTimeout(()=>r.remove(),8000)}}}
function cld(file,onp){return new Promise((ok,ko)=>{const x=new XMLHttpRequest(),b=new FormData();b.append('file',file);b.append('upload_preset',CLOUD_PRESET);x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);x.upload.onprogress=e=>e.lengthComputable&&onp&&onp(Math.round(e.loaded/e.total*100));x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status===200&&j.secure_url?ok(j):ko(new Error(j.error?.message||'Cloudinary rechazó el archivo'))};x.onerror=()=>ko(new Error('Error de red al subir'));x.send(b)})}
function upload(list){const parent=S.parent,u=S.user.uid;let tot=used();[...list].forEach(async f=>{if(!f.size){toast(`${f.name}: no se pueden subir carpetas ni archivos vacíos`,1);return}
if(tot+f.size>quota()){toast('No tienes suficiente almacenamiento.',1);return}tot+=f.size;const p=prog(f.name,f.size);
try{const j=await cld(f,p.set);await addDoc(collection(db,'files'),{ownerId:u,name:f.name,size:f.size,mime:f.type,url:j.secure_url,pid:j.public_id,rt:j.resource_type,parent,isFolder:false,trashed:false,createdAt:serverTimestamp()});p.ok()}catch(e){tot-=f.size;p.err(em(e))}})}

/* ---------- Operaciones ---------- */
const setT=ids=>t=>Promise.all(ids.map(async id=>{const f=byId(id);const d={trashed:t};if(!t||f.parent==='root'||byId(f.parent))null;else d.parent='root';await updateDoc(doc(db,'files',id),d);if(t&&S.shares.some(s=>s.id===id&&s.active))await updateDoc(doc(db,'shares',id),{active:false})}));
async function purge(ids){const all=new Set(),walk=i=>{all.add(i);S.files.filter(f=>f.parent===i).forEach(f=>walk(f.id))};ids.forEach(walk);
await Promise.all([...all].map(async i=>{const f=byId(i);if(!f)return;if(S.shares.some(s=>s.id===i))await deleteDoc(doc(db,'shares',i));await deleteDoc(doc(db,'files',i))}))}
const act={
go(p){S.page=p;authPages()},
async auth(m){const v=n=>($('#'+n)?.value||'').trim(),email=v('em'),pw=$('#pw')?.value||'',btn=$('#sub'),bad=x=>{$('#err').textContent=x};bad('');
if(!/^\S+@\S+\.\S+$/.test(email))return bad('Introduce un email válido.');
try{btn.disabled=true;
if(m==='reset'){await sendPasswordResetEmail(auth,email);toast('Te enviamos un correo para recuperar tu contraseña');return act.go('login')}
if(!pw)return bad('Escribe tu contraseña.');
if(m==='register'){const n=v('nm');if(!n)return bad('El nombre es obligatorio.');if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))return bad('La contraseña debe tener al menos 8 caracteres, con letras y números.');if(pw!==$('#pw2').value)return bad('Las contraseñas no coinciden.');
S.pendingName=n;const c=await createUserWithEmailAndPassword(auth,email,pw);await updateProfile(c.user,{displayName:n})}
else await signInWithEmailAndPassword(auth,email,pw)}catch(e){bad(em(e))}finally{btn.disabled=false}},
async google(){const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))return signInWithRedirect(auth,p);if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))toast(em(e),1)}},
view(v){S.view=v;shell()},burger(){$('#side').classList.toggle('open');$('#ov').classList.toggle('on')},
pick(){$('#fi').click()},grid(){S.grid=!S.grid;renderMain()},unsel(){S.sel.clear();renderList()},
nav(id){S.parent=id;S.q='';S.sel.clear();if($('#q'))$('#q').value='';renderList()},
sel(id,el){el.checked?S.sel.add(id):S.sel.delete(id);renderList()},
open(id){const f=byId(id);if(!f)return;if(f.isFolder){if(S.view==='trash')return;S.q='';S.sel.clear();S.parent=id;if(S.view!=='files'){S.view='files';return shell()}return renderList()}return act.prev(id)},
async prev(id){const f=byId(id),u=await url(id),k=kind(f),e=ext(f.name);
const b=k==='image'?`<img src="${u}" alt="">`:k==='video'?`<video src="${u}" controls playsinline></video>`:k==='audio'?`<audio src="${u}" controls></audio>`:['pdf','txt','json'].includes(e)?`<iframe src="${u}"></iframe>`:`<div class="bigic">${icon(f)}</div><p class="mu">Sin vista previa para este tipo de archivo.</p>`;
if(await modal(esc(f.name),`<div class="pv">${b}</div><p class="mu">${sz(f.size)} · ${fd(f.t)}</p>`,'⬇ Descargar'))dl(f.name,u)},
async dl(id){dl(byId(id).name,await url(id))},
menu(id,el){const f=byId(id),r=el.getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.style.top=Math.max(8,Math.min(r.bottom,innerHeight-290))+'px';p.style.left=Math.max(8,Math.min(r.right-170,innerWidth-186))+'px';
const L=S.view==='trash'?[['restore','↩ Restaurar'],['purge1','🗑 Eliminar para siempre']]:[['open',f.isFolder?'📂 Abrir':'👁 Ver'],...(f.isFolder?[]:[['dl','⬇ Descargar'],['share','🔗 Compartir y QR']]),['rename','✏️ Renombrar'],['move','📁 Mover'],['trash','🗑 A la papelera']];
p.innerHTML=L.map(([a,l])=>`<button data-a="${a}" data-id="${id}">${l}</button>`).join('');document.body.append(p)},
async newf(){const m=await modal('Nueva carpeta','<input id="mi" placeholder="Nombre de la carpeta" maxlength="100">','Crear');const n=m?.querySelector('#mi').value.trim();if(!n)return;await addDoc(collection(db,'files'),{ownerId:S.user.uid,name:n,isFolder:true,parent:S.parent,trashed:false,size:0,createdAt:serverTimestamp()});toast('Carpeta creada')},
async rename(id){const f=byId(id),m=await modal('Renombrar',`<input id="mi" value="${esc(f.name)}" maxlength="150">`,'Guardar'),n=m?.querySelector('#mi').value.trim();if(!n||n===f.name)return;await updateDoc(doc(db,'files',id),{name:n});if(S.shares.some(s=>s.id===id))await updateDoc(doc(db,'shares',id),{name:n});toast('Renombrado')},
async move(id){const ids=id?[id]:[...S.sel],ex=new Set(),walk=i=>{ex.add(i);S.files.filter(f=>f.parent===i&&f.isFolder).forEach(f=>walk(f.id))};ids.forEach(i=>byId(i)?.isFolder&&walk(i));
const path=f=>{let s=f.name,p=f.parent;while(p!=='root'&&byId(p)){s=byId(p).name+' / '+s;p=byId(p).parent}return s};
const o=S.files.filter(f=>f.isFolder&&!f.trashed&&live(f)&&!ex.has(f.id));
const m=await modal('Mover a',`<select id="mi"><option value="root">Mis archivos</option>${o.map(f=>`<option value="${f.id}">${esc(path(f))}</option>`).join('')}</select>`,'Mover');if(!m)return;
const t=m.querySelector('#mi').value;await Promise.all(ids.map(i=>updateDoc(doc(db,'files',i),{parent:t})));S.sel.clear();toast('Movido')},
async trash(id){const ids=id?[id]:[...S.sel];if(!ids.length)return;await setT(ids)(true);S.sel.clear();toast('Enviado a la papelera')},
async restore(id){await setT([id])(false);toast('Restaurado')},
async purge1(id){if(await modal('Eliminar para siempre',`<p>«${esc(byId(id).name)}» se borrará definitivamente.</p>`,'Eliminar')){await purge([id]);toast('Eliminado definitivamente')}},
async empty(){const ids=S.files.filter(f=>f.trashed&&live(f)).map(f=>f.id);if(ids.length&&await modal('Vaciar papelera',`<p>Se borrarán ${ids.length} elemento(s) para siempre.</p>`,'Vaciar')){await purge(ids);toast('Papelera vaciada')}},
async share(id){const f=byId(id),s=S.shares.find(x=>x.id===id);if(!s)await setDoc(doc(db,'shares',id),{ownerId:S.user.uid,name:f.name,size:f.size,mime:f.mime||'',url:f.url,createdAt:serverTimestamp(),active:true,downloads:0});else if(!s.active)await updateDoc(doc(db,'shares',id),{active:true});return act.qr(id)},
async qr(id){const L=link(id),nm=(byId(id)||S.shares.find(x=>x.id===id)||{}).name||'archivo',{default:Q}=await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm'),img=await Q.toDataURL(L,{width:360,margin:2,color:{dark:'#0a0f1f',light:'#ffffff'}});
if(await modal('Compartir archivo',`<p class="mu">Escanea el código con la cámara para abrir la página de descarga de «${esc(nm)}», o copia el enlace.</p><div class="qr"><img src="${img}" alt="Código QR"></div><input readonly value="${L}" onfocus="this.select()"><a class="btn ghost" href="${img}" download="QR-${esc(nm)}.png">⬇ Guardar imagen del QR</a>`,'Copiar enlace'))copy(L)},
theme(id,el){const d=document.documentElement.dataset.theme!=='dark';setTheme(d);el.innerHTML=`<span>${d?'☀️':'🌙'}</span><i>${d?'Tema claro':'Tema oscuro'}</i>`},
burger2(){$('#side').classList.remove('open');$('#ov').classList.remove('on')},dpick(){act.burger2();$('#fi').click()},dnewf(){act.burger2();return act.newf()},
async newfd(){S.parent='root';return act.newf()},flt(id){S.filter=id;renderMain()},
cp(id){copy(link(id))},async tog(id){const s=S.shares.find(x=>x.id===id);await updateDoc(doc(db,'shares',id),{active:!s.active});toast(s.active?'Enlace desactivado':'Enlace activado')},
async saven(){const n=$('#pn').value.trim();if(!n)return toast('El nombre es obligatorio',1);await updateProfile(auth.currentUser,{displayName:n});await updateDoc(doc(db,'users',S.user.uid),{name:n});toast('Nombre actualizado')},
async savep(){const p=$('#np').value;if(p.length<8||!/[A-Za-z]/.test(p)||!/\d/.test(p))return toast('Mínimo 8 caracteres, con letras y números',1);await updatePassword(auth.currentUser,p);$('#np').value='';toast('Contraseña cambiada')},
rst(){return sendPasswordResetEmail(auth,S.user.email).then(()=>toast('Correo enviado'))},
out(){return signOut(auth)},
photo(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>5e6)return toast('La foto debe pesar menos de 5 MB',1);try{const j=await cld(f);await updateDoc(doc(db,'users',S.user.uid),{photo:j.secure_url});toast('Foto actualizada')}catch(e){toast(em(e),1)}};i.click()}};

/* ---------- Página pública ---------- */
async function pub(id){$('#app').innerHTML=`<div class="authw"><div class="authb" id="pb" style="text-align:center"><div class="logo">☁️ MediaCloud</div><p class="mu">Cargando…</p></div></div>`;
try{const d=await getDoc(doc(db,'shares',id));if(!d.exists()||!d.data().active)throw 0;const s=d.data(),f={name:s.name},k=kind(f),e=ext(s.name),u=s.url;
const pv=k==='image'?`<img src="${u}" alt="">`:k==='video'?`<video src="${u}" controls playsinline></video>`:k==='audio'?`<audio src="${u}" controls></audio>`:e==='pdf'?`<iframe src="${u}"></iframe>`:`<div class="bigic">${icon(f)}</div>`;
$('#pb').innerHTML=`<div class="logo">☁️ MediaCloud</div><div class="pv">${pv}</div><h2 style="word-break:break-all">${esc(s.name)}</h2><p class="mu">Tipo: ${(e||'archivo').toUpperCase()} · ${sz(s.size)} · ${fd(s.createdAt.toMillis())}</p><br><button class="btn big" id="pd">⬇ Descargar</button><div class="lk"><a id="hm">Ir a MediaCloud</a></div>`;
$('#pd').onclick=async()=>{try{await updateDoc(doc(db,'shares',id),{downloads:increment(1)})}catch{}dl(s.name,u)};$('#hm').onclick=()=>{location.hash=''}}
catch{$('#pb').innerHTML=`<div class="logo">☁️ MediaCloud</div><div class="empty"><div>🚫</div><h3>Enlace no disponible</h3><p>Fue desactivado o ya no existe.</p></div><a id="hm">Ir a MediaCloud</a>`;$('#hm').onclick=()=>{location.hash=''}}}

/* ---------- Eventos globales ---------- */
document.addEventListener('click',e=>{$('.pop')?.remove();const a=e.target.closest('[data-a]');if(a&&act[a.dataset.a])Promise.resolve(act[a.dataset.a](a.dataset.id,a,e)).catch(x=>toast(em(x),1))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.authb')&&$('#sub'))$('#sub').click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='flt'){S.filter=e.target.value;renderList()}else if(i==='srt'){S.sort=e.target.value;renderList()}else if(i==='th')setTheme(e.target.checked);else if(i==='nt')localStorage.setItem('mc-notif',e.target.checked?'1':'0')});
$('#fi').addEventListener('change',e=>{if(S.user)upload(e.target.files);e.target.value=''});
['dragover','dragleave','drop'].forEach(t=>addEventListener(t,e=>{if(!S.user||S.view!=='files')return;e.preventDefault();document.body.classList.toggle('drag',t==='dragover');if(t==='drop'&&e.dataTransfer.files.length)upload(e.dataTransfer.files)}));
function route(){const h=location.hash;if(h.startsWith('#/s/'))return pub(h.slice(4));if(S.user===undefined)return;S.user?shell():authPages()}
addEventListener('hashchange',route);
async function ensureProfile(u){try{const r=doc(db,'users',u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{name:S.pendingName||u.displayName||u.email.split('@')[0],email:u.email,quota:QUOTA,photo:u.photoURL||'',createdAt:serverTimestamp()})}catch(e){toast(em(e),1)}}
let unsub=[];
onAuthStateChanged(auth,u=>{unsub.forEach(f=>f());unsub=[];Object.assign(S,{user:u,files:[],shares:[],profile:null,loaded:false,parent:'root',q:'',sel:new Set(),urls:{},page:'landing'});
if(u){ensureProfile(u);S.view='dash';unsub=[onSnapshot(doc(db,'users',u.uid),d=>{S.profile=d.data()||null;refresh()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'files'),where('ownerId','==',u.uid)),s=>{S.files=s.docs.map(mp);S.loaded=true;refresh()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'shares'),where('ownerId','==',u.uid)),s=>{S.shares=s.docs.map(mp);refresh()},e=>toast(em(e),1))]}
route()});

</script></body></html>
