<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>KendyLink · Convierte tus archivos en enlaces</title>
<style>
  :root{--bg:#0b0d12;--bg2:#11141b;--card:#161a23;--line:#262c38;--txt:#eceef4;--mut:#8e97aa;--acc:#6c8cff;--acc2:#a56cff;--ok:#3ecf8e;--err:#ff6b6b;--shadow:0 10px 30px #0006}
  [data-theme=light]{--bg:#f4f5fa;--bg2:#ffffff;--card:#ffffff;--line:#e2e5ee;--txt:#161922;--mut:#667085;--shadow:0 10px 30px #1a2a6c18}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  a{color:var(--acc);text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}
  /* header */
  .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:10px;height:58px}
  .brand{font-weight:800;font-size:1.15rem;color:var(--txt);display:flex;align-items:center;gap:8px}
  .brand i{font-style:normal;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:9px;width:30px;height:30px;display:grid;place-items:center;font-size:1rem}
  .top nav{display:flex;gap:4px;margin-left:12px}
  .top nav a{color:var(--mut);padding:6px 10px;border-radius:8px;font-size:.92rem}
  .top nav a:hover{color:var(--txt);background:var(--line)}
  .sp{flex:1}
  .icon{background:transparent;border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;padding:0;font-size:1.05rem}
  .user{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut)}
  .user b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
  .user span{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:640px){.top nav{display:none}.user span{display:none}}
  /* buttons / inputs */
  button,.btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));display:inline-block;text-align:center}
  button.sec,.btn.sec{background:var(--line);color:var(--txt)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  button.sm,.btn.sm{padding:7px 11px;font-size:.82rem;border-radius:8px}
  button:disabled{opacity:.5;cursor:not-allowed}
  label{display:block;font-size:.82rem;color:var(--mut);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit}
  textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;resize:vertical}
  input[readonly]{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
  .row{display:flex;gap:8px;align-items:flex-start}
  .row>input,.row>textarea{flex:1;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .note{font-size:.82rem;color:var(--mut)}
  code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:.85em}
  /* hero */
  .hero{padding:56px 0 34px;text-align:center;background:radial-gradient(700px 300px at 20% 0,#6c8cff22,transparent),radial-gradient(600px 300px at 85% 10%,#a56cff22,transparent)}
  .hero h1{font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}
  .hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{max-width:620px;margin:0 auto 22px;color:var(--mut);font-size:1.08rem}
  .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .cta .btn,.cta button{padding:13px 22px;font-size:1rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:5px 12px;border-radius:99px;font-size:.8rem}
  .chip.ok{color:var(--ok)}
  section.blk{padding:34px 0}
  section.blk h2{font-size:1.5rem;margin:0 0 4px}
  section.blk>.wrap>p{color:var(--mut);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--txt);transition:.15s}
  .tcard:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:var(--shadow)}
  .tcard .ti{font-size:1.8rem;display:block;margin-bottom:8px}
  .tcard b{display:block;font-size:1.02rem}
  .tcard span.d{color:var(--mut);font-size:.86rem}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .step b.n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;margin-bottom:8px}
  .types{display:flex;flex-wrap:wrap;gap:8px}
  .types span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:.84rem;font-family:ui-monospace,Menlo,monospace}
  footer{border-top:1px solid var(--line);padding:26px 0 50px;color:var(--mut);font-size:.85rem;text-align:center}
  /* tool view */
  .tool{padding:22px 0 60px}
  .back{background:transparent;color:var(--mut);padding:6px 0;font-weight:500}
  .tool h2{font-size:1.6rem;margin:6px 0 2px}
  .tool>p{color:var(--mut);margin:0 0 16px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .opts label{margin-top:0}
  .drop{border:2px dashed var(--line);border-radius:18px;padding:40px 16px;text-align:center;cursor:pointer;transition:.2s;background:var(--card)}
  .drop.over,.drop:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
  .drop .big{font-size:2.4rem}
  .drop b{display:block;font-size:1.05rem;margin:4px 0}
  .drop span{color:var(--mut);font-size:.88rem}
  #results{margin-top:16px}
  .name{font-weight:700;word-break:break-all}
  .meta{color:var(--mut);font-size:.82rem}
  .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .15s}
  .st-ok{color:var(--ok)}.st-err{color:var(--err)}
  .prev{margin:12px 0}
  .prev img,.prev video{max-width:100%;max-height:280px;border-radius:12px;display:block}
  .prev audio{width:100%}
  .main{background:color-mix(in srgb,var(--acc) 9%,var(--bg));border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:12px;padding:12px;margin:10px 0}
  .main label{margin-top:0;color:var(--acc);font-weight:700}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  details.grp{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--bg2)}
  details.grp summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:.93rem;list-style:none}
  details.grp summary::before{content:"▸ ";color:var(--mut)}
  details.grp[open] summary::before{content:"▾ "}
  details.grp .in{padding:0 14px 14px}
  .share{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
  .qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .qr img{width:150px;height:150px;border-radius:10px;background:#fff;padding:6px}
  /* history */
  .hitem{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
  .hthumb{width:56px;height:56px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:1.5rem;overflow:hidden;flex:none}
  .hthumb img{width:100%;height:100%;object-fit:cover}
  .hinfo{flex:1;min-width:0}
  .hinfo .name{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbtn{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .hdet{margin:-4px 0 12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters input{flex:2;min-width:160px}.filters select{flex:1;min-width:120px}
  .badge{font-size:.7rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut);margin-left:6px}
  .banner{border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));background:color-mix(in srgb,var(--acc) 9%,var(--card));border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.9rem}
  /* dialogs, toasts */
  dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(420px,calc(100vw - 28px));box-shadow:var(--shadow)}
  dialog::backdrop{background:#000a}
  dialog h3{margin:0 0 4px}
  .tabs{display:flex;gap:6px;margin:12px 0}
  .tabs button{flex:1}
  .gbtn{width:100%;background:#fff;color:#222;border:1px solid #ddd}
  .or{text-align:center;color:var(--mut);font-size:.8rem;margin:12px 0 0}
  #toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;width:min(420px,calc(100vw - 24px))}
  .toast{background:var(--txt);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:.9rem;box-shadow:var(--shadow);animation:in .2s}
  .toast.err{background:var(--err);color:#fff}.toast.ok{background:var(--ok);color:#06220f}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><i>🔗</i>KendyLink</a>
  <nav><a href="#/">Inicio</a><a href="#/history">Historial</a></nav>
  <div class="sp"></div>
  <button class="icon" data-act="theme" title="Tema claro/oscuro">🌓</button>
  <button class="icon" data-act="settings" title="Ajustes">⚙️</button>
  <div id="authBox"></div>
</div></header>

<main id="app"></main>
<div id="toasts"></div>

<dialog id="authDlg">
  <h3>Tu cuenta</h3>
  <p class="note" style="margin:0">Es opcional. Con cuenta guardas tu historial de enlaces en la nube y lo ves desde cualquier dispositivo.</p>
  <button class="gbtn" style="margin-top:14px" data-act="google">🔵 Continuar con Google</button>
  <div class="or">— o con correo —</div>
  <div class="tabs"><button class="sec" id="tabIn" data-act="authmode" data-m="in">Entrar</button><button class="ghost" id="tabUp" data-act="authmode" data-m="up">Crear cuenta</button></div>
  <form id="authForm">
    <label>Correo</label><input type="email" id="aMail" autocomplete="email" required>
    <label>Contraseña</label><input type="password" id="aPass" autocomplete="current-password" minlength="6" required>
    <div class="note" id="aErr" style="color:var(--err);min-height:1.2em;margin-top:8px"></div>
    <div class="row" style="margin-top:8px"><button type="submit" id="aGo" style="flex:1">Entrar</button><button type="button" class="sec" data-act="close">Cerrar</button></div>
    <p class="note" style="text-align:center;margin:12px 0 0"><a href="#" data-act="reset">¿Olvidaste tu contraseña?</a></p>
  </form>
</dialog>

<dialog id="setDlg">
  <h3>Ajustes de Cloudinary</h3>
  <p class="note" style="margin:0">Ya vienen configurados. Cámbialos solo si quieres usar tu propia cuenta.</p>
  <label>Cloud name</label><input id="sCloud">
  <label>Upload preset (debe ser <code>Unsigned</code>)</label><input id="sPreset">
  <div class="row" style="margin-top:14px"><button data-act="savecfg" style="flex:1">Guardar</button><button class="sec" data-act="resetcfg">Restablecer</button><button class="ghost" data-act="close">Cerrar</button></div>
</dialog>

<noscript><p style="padding:20px">Necesitas activar JavaScript.</p></noscript>

<script type="module">
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmtB=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const toast=(m,t='')=>{const d=document.createElement('div');d.className='toast '+t;d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),4200)};
const copyText=async v=>{try{await navigator.clipboard.writeText(v)}catch(e){const t=document.createElement('textarea');t.value=v;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast('Copiado ✔','ok')};
const app=$('#app');

const DEFAULTS={cloud:'dkryox5u',preset:'KendyR'};
const cfg=Object.assign({},DEFAULTS,ls.get('kl_cfg',{}));
document.documentElement.dataset.theme=ls.get('kl_theme',matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');

const firebaseConfig={
  apiKey:"AIzaSyAWr9YM0YAG0mx0SEk3qNEhjeS1MOu_2lg",
  authDomain:"kendy-57bcd.firebaseapp.com",
  projectId:"kendy-57bcd",
  storageBucket:"kendy-57bcd.firebasestorage.app",
  messagingSenderId:"678778497788",
  appId:"1:678778497788:web:1e26e4c5be5c60f2f98579",
  measurementId:"G-KKW9TV2H8J"
};

/* ============ herramientas ============ */
const TOOLS=[
 {id:'video',icon:'🎬',title:'Vídeo → enlace',desc:'MP4, WebM, HLS, DASH, GIF, miniatura y audio',type:'upload',accept:'video/*',opts:['w'],hint:'MP4, MOV, WebM, MKV…'},
 {id:'image',icon:'🖼️',title:'Foto → enlace',desc:'JPG, PNG, WebP, AVIF, redimensionar y miniaturas',type:'upload',accept:'image/*',opts:['w','fmt'],hint:'JPG, PNG, WebP, GIF, HEIC…'},
 {id:'audio',icon:'🎵',title:'Música → enlace',desc:'MP3, M4A, OGG, WAV',type:'upload',accept:'audio/*',hint:'MP3, WAV, M4A, OGG, FLAC…'},
 {id:'gif',icon:'👾',title:'Vídeo → GIF',desc:'Convierte un vídeo en GIF animado',type:'upload',accept:'video/*',focus:'gif',hint:'Se genera un GIF de hasta 8 segundos'},
 {id:'v2mp3',icon:'🎧',title:'Extraer audio (MP3)',desc:'Saca el sonido de cualquier vídeo',type:'upload',accept:'video/*',focus:'mp3',hint:'Sube un vídeo y recibes el MP3'},
 {id:'compress',icon:'🗜️',title:'Comprimir y optimizar',desc:'Fotos y vídeos más ligeros, misma calidad',type:'upload',accept:'image/*,video/*',focus:'opt',opts:['w'],hint:'Foto o vídeo'},
 {id:'img2mp4',icon:'📽️',title:'Foto → vídeo MP4',desc:'Convierte una foto en un MP4 con duración',type:'convert',accept:'image/*',opts:['dur'],hint:'Una o varias fotos'},
 {id:'aud2mp4',icon:'🎼',title:'Música → vídeo MP4',desc:'MP4 con ondas animadas y tu audio',type:'convert',accept:'audio/*',hint:'Se convierte en tiempo real'},
 {id:'url',icon:'🌐',title:'Desde una URL',desc:'Pega un enlace y lo alojamos en tu Cloudinary',type:'url'},
 {id:'file',icon:'📄',title:'Cualquier archivo',desc:'PDF, ZIP, DOC… enlace directo o de descarga',type:'upload',accept:'*/*',hint:'Detecta el tipo automáticamente'},
 {id:'qr',icon:'🔳',title:'Generador de QR',desc:'Crea un QR de cualquier enlace o texto',type:'qr'}
];
const LINKTYPES=['MP4','WebM','HLS .m3u8','DASH .mpd','GIF','MP3','M4A','OGG','WAV','JPG','PNG','WebP','AVIF','Miniatura','Descarga directa','QR','HTML <video>','HTML <audio>','HTML <img>','<picture>','iframe','Markdown','BBCode','Open Graph','JSON','cURL','Flutter','Android','Swift','Unity','Python','WhatsApp','Telegram','X','Facebook','Reddit','LinkedIn','Email'];

/* ============ estado: auth e historial ============ */
let fb=null,user=null,currentTool=null;
const RECS=new Map();

async function initFirebase(){
  try{
    const V='10.14.1',B=`https://www.gstatic.com/firebasejs/${V}/`;
    const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const a=initializeApp(firebaseConfig);
    fb={A,F,auth:A.getAuth(a),db:F.getFirestore(a)};
    A.onAuthStateChanged(fb.auth,u=>{user=u;renderAuth();if(location.hash.startsWith('#/history'))renderHistory()});
  }catch(e){console.warn('Firebase no disponible',e);renderAuth()}
}
function renderAuth(){
  const b=$('#authBox');
  if(user){const n=user.displayName||user.email||'Usuario';b.innerHTML=`<div class="user"><b>${esc(n[0].toUpperCase())}</b><span>${esc(n)}</span><button class="sec sm" data-act="logout">Salir</button></div>`}
  else b.innerHTML=`<button class="sm" data-act="login">Iniciar sesión</button>`;
}
const AERR={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/invalid-email':'Correo no válido.','auth/email-already-in-use':'Ese correo ya tiene cuenta.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/popup-closed-by-user':'Cerraste la ventana de Google.','auth/unauthorized-domain':'Dominio no autorizado: añádelo en Firebase → Authentication → Settings → Authorized domains.','auth/operation-not-allowed':'Ese método no está activado en Firebase → Authentication → Sign-in method.','auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/network-request-failed':'Sin conexión.','auth/popup-blocked':'El navegador bloqueó la ventana emergente.','auth/operation-not-supported-in-this-environment':'Abre la web desde https:// (no desde un archivo local).','auth/missing-email':'Escribe tu correo.'};
const aerr=e=>AERR[e.code]||e.message||'Error de autenticación.';
let authMode='in';

async function saveRecord(rec){
  const h=ls.get('kl_hist',[]);h.unshift(rec);ls.set('kl_hist',h.slice(0,300));
  if(user&&fb){try{const c=JSON.parse(JSON.stringify(rec));delete c.dt;await fb.F.setDoc(fb.F.doc(fb.db,'users',user.uid,'links',rec.id),c)}catch(e){toast('Guardado local. No pude sincronizar con la nube (revisa las reglas de Firestore).','err')}}
}
let cloudIds=new Set();
async function loadHistory(){
  const local=ls.get('kl_hist',[]);let cl=[];
  if(user&&fb){try{const {F,db}=fb;const q=F.query(F.collection(db,'users',user.uid,'links'),F.orderBy('createdAt','desc'),F.limit(300));cl=(await F.getDocs(q)).docs.map(d=>d.data())}catch(e){toast('No pude leer tu historial en la nube (revisa las reglas de Firestore).','err')}}
  cloudIds=new Set(cl.map(r=>r.id));
  const m=new Map();[...cl,...local].forEach(r=>{if(!m.has(r.id))m.set(r.id,r)});
  return [...m.values()].sort((a,b)=>b.createdAt-a.createdAt);
}
async function removeRecord(id){
  ls.set('kl_hist',ls.get('kl_hist',[]).filter(r=>r.id!==id));
  if(user&&fb){try{await fb.F.deleteDoc(fb.F.doc(fb.db,'users',user.uid,'links',id))}catch(e){}}
}

/* ============ Cloudinary ============ */
const endpoint=()=>`https://api.cloudinary.com/v1_1/${encodeURIComponent(cfg.cloud)}/auto/upload`;
function xhrSend(fd,headers,onLoaded){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open('POST',endpoint());
    for(const k in headers)x.setRequestHeader(k,headers[k]);
    x.upload.onprogress=e=>e.lengthComputable&&onLoaded&&onLoaded(e.loaded);
    x.onerror=()=>rej(new Error('Error de red o bloqueo del servicio.'));
    x.onload=()=>{let j=null;try{j=JSON.parse(x.responseText)}catch(e){}
      if(x.status>=200&&x.status<300&&j)res(j);else rej(new Error(j?.error?.message||('Cloudinary respondió HTTP '+x.status)))};
    x.send(fd);
  });
}
async function cldUpload(src,onP){
  const base=()=>{const fd=new FormData();fd.append('upload_preset',cfg.preset);fd.append('tags','kendylink');return fd};
  if(typeof src==='string'){const fd=base();fd.append('file',src);onP(30);const r=await xhrSend(fd,{});onP(100);return r}
  const CH=6*1024*1024;
  if(src.size<=20*1024*1024){const fd=base();fd.append('file',src);return xhrSend(fd,{},l=>onP(l/src.size*100))}
  const id=Date.now()+'-'+Math.random().toString(36).slice(2);let last;
  for(let s=0;s<src.size;s+=CH){
    const e=Math.min(s+CH,src.size)-1,fd=base();fd.append('file',src.slice(s,e+1),src.name);
    last=await xhrSend(fd,{'X-Unique-Upload-Id':id,'Content-Range':`bytes ${s}-${e}/${src.size}`},l=>onP((s+l)/src.size*100));
  }
  return last;
}

/* ============ generador de enlaces ============ */

/* ============ conversión a MP4 en el navegador ============ */
const MIMES=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1','video/mp4'];
const mp4Mime=()=>window.MediaRecorder?MIMES.find(m=>MediaRecorder.isTypeSupported(m)):null;
const even=n=>Math.max(2,Math.round(n/2)*2);
const fit=(w,h)=>{const s=Math.min(1,1280/Math.max(w,h));return[even(w*s),even(h*s)]};
function record(stream,mime,stopP){
  return new Promise((res,rej)=>{
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4e6,audioBitsPerSecond:128e3});const ch=[];
    rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    rec.onerror=e=>rej(e.error||new Error('Error al grabar el MP4'));
    rec.onstop=()=>res(new Blob(ch,{type:'video/mp4'}));
    rec.start(500);
    stopP.then(()=>new Promise(r=>setTimeout(r,300))).then(()=>rec.state!=='inactive'&&rec.stop(),rej);
  });
}
async function imageToMp4(file,mime,secs,onP){
  const url=URL.createObjectURL(file),img=new Image();img.src=url;
  await img.decode().catch(()=>{throw new Error('No se puede leer la imagen (¿formato HEIC?).')});
  const [W,H]=fit(img.naturalWidth,img.naturalHeight),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const cx=cv.getContext('2d'),t0=performance.now();let on=true;
  (function loop(){if(!on)return;cx.drawImage(img,0,0,W,H);onP(Math.min(99,(performance.now()-t0)/(secs*10)));requestAnimationFrame(loop)})();
  const blob=await record(cv.captureStream(30),mime,new Promise(r=>setTimeout(r,secs*1000)));
  on=false;URL.revokeObjectURL(url);return blob;
}
async function audioToMp4(file,mime,onP){
  const url=URL.createObjectURL(file),el=document.createElement('audio');
  el.src=url;el.preload='auto';el.style.cssText='position:fixed;left:-9999px';document.body.appendChild(el);
  await new Promise((r,j)=>{el.onloadedmetadata=r;el.onerror=()=>j(new Error('No se puede leer el audio.'))});
  const W=1280,H=720,cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
  const ac=new(window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaElementSource(el),an=ac.createAnalyser();an.fftSize=128;
  const dest=ac.createMediaStreamDestination();src.connect(an);an.connect(dest);
  const data=new Uint8Array(an.frequencyBinCount),title=file.name.replace(/\.[^.]+$/,'');let on=true;
  (function loop(){if(!on)return;
    cx.fillStyle='#0f1115';cx.fillRect(0,0,W,H);an.getByteFrequencyData(data);
    const n=data.length,bw=W/n;for(let i=0;i<n;i++){const h=data[i]/255*H*.55;cx.fillStyle=`hsl(${220+i*1.2},80%,65%)`;cx.fillRect(i*bw+2,H*.75-h,bw-4,h)}
    cx.fillStyle='#eceef4';cx.font='600 44px system-ui,sans-serif';cx.textAlign='center';cx.fillText('♪ '+title.slice(0,40),W/2,H*.88);
    if(isFinite(el.duration))onP(Math.min(99,el.currentTime/el.duration*100));requestAnimationFrame(loop)})();
  const stream=new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);
  const ended=new Promise(r=>el.onended=r);await ac.resume();
  const rp=record(stream,mime,ended);
  await el.play().catch(()=>{throw new Error('El navegador bloqueó la reproducción necesaria para convertir.')});
  const blob=await rp;on=false;ac.close();el.remove();URL.revokeObjectURL(url);return blob;
}

}
async function processFile(t,file,box){
  const ui=newItem(file.name,fmtB(file.size)+(file.type?' · '+file.type:'')),opts=readOpts();
  try{
    let up=file,tc=false,off=0,sc=1;
    if(t.type==='convert'){
      const mime=mp4Mime();if(!mime)throw new Error('Este navegador no puede crear MP4. Usa Chrome, Edge o Safari.');
      const onP=p=>ui.setP(p/2,'Convirtiendo a MP4… '+Math.round(p)+'%');ui.setP(0,'Convirtiendo a MP4…');
      const blob=t.id==='img2mp4'?await imageToMp4(file,mime,opts.dur,onP):await audioToMp4(file,mime,onP);
      const base=(file.name.replace(/\.[^.]+$/,'')||'media').replace(/[^\w\-]+/g,'_');
      up=new File([blob],base+'.mp4',{type:'video/mp4'});tc=true;off=50;sc=.5;
    }
    ui.setP(off,'Subiendo…');
    const res=await cldUpload(up,p=>ui.setP(off+p*sc,'Subiendo… '+Math.round(p)+'%'));
    const rec=mkRec(t,file.name,res,opts,tc);await saveRecord(rec);ui.ok();renderResult(rec,ui.out);
  }catch(e){ui.fail(e.message||String(e))}
}
async function processUrl(t,url){
  if(!/^https?:\/\//i.test(url))return toast('Escribe una URL que empiece por http:// o https://','err');
  const ui=newItem(url,'Desde URL'),opts={};
  try{ui.setP(10,'Cloudinary está descargando el archivo…');const res=await cldUpload(url,p=>ui.setP(p,'Procesando…'));
    const name=decodeURIComponent((url.split('?')[0].split('/').pop())||'archivo');
    const rec=mkRec(t,name,res,opts,false);await saveRecord(rec);ui.ok();renderResult(rec,ui.out)}
  catch(e){ui.fail(e.message||String(e))}
}

/* ============ historial ============ */
async function renderHistory(){
  app.innerHTML=`<div class="wrap tool"><button class="back" data-act="home">← Volver al inicio</button><h2>🗂️ Mi historial</h2><p>Todos los enlaces que has creado.</p><div id="hbody"><p class="note">Cargando…</p></div></div>`;
  const recs=await loadHistory();if(!$('#hbody'))return;
  $('#hbody').innerHTML=`${user?`<div class="banner">☁️ Sesión iniciada: tu historial se guarda también en tu cuenta.</div>`:`<div class="banner">💡 Ahora mismo se guarda solo en este navegador. <a href="#" data-act="login">Inicia sesión</a> (opcional) para tenerlo en la nube.</div>`}
  <div class="filters"><input id="hq" placeholder="Buscar…"><select id="hk"><option value="">Todos</option><option value="video">Vídeos</option><option value="image">Fotos</option><option value="audio">Audio</option><option value="raw">Archivos</option></select><button class="sec sm" data-act="exjson">JSON</button><button class="sec sm" data-act="excsv">CSV</button><button class="sec sm" data-act="clearlocal">Borrar local</button></div>
  <div id="hlist"></div>`;
  const draw=()=>{
    const q=$('#hq').value.toLowerCase(),k=$('#hk').value;
    const list=recs.filter(r=>(!k||kindOf(r)===k)&&(!q||(r.name||'').toLowerCase().includes(q)));
    $('#hlist').innerHTML=list.length?list.map(r=>{RECS.set(r.id,r);const L=linkSet(r);
      const th=L.thumb&&L.kind!=='raw'?`<img loading="lazy" src="${esc(L.kind==='image'?L.thumb:r.res.resource_type==='video'?`https://res.cloudinary.com/${r.cloud}/video/upload/so_0,c_fill,w_112,h_112/v${r.res.version}/${r.res.public_id}.jpg`:L.thumb)}" alt="">`:({audio:'🎵',raw:'📄',video:'🎬',image:'🖼️'}[L.kind]);
      return `<div class="hitem" data-id="${r.id}"><div class="hthumb">${th}</div><div class="hinfo"><div class="name">${esc(r.name||'archivo')}</div><div class="meta">${new Date(r.createdAt).toLocaleString('es')}${r.bytes?' · '+fmtB(r.bytes):''}<span class="badge">${L.kind}</span>${cloudIds.has(r.id)?'<span class="badge">☁️</span>':''}</div></div>
      <div class="hbtn"><button class="sm" data-act="hcopy" data-id="${r.id}">Copiar</button><button class="sec sm" data-act="hdet" data-id="${r.id}">Detalles</button><button class="ghost sm" data-act="hdel" data-id="${r.id}">✕</button></div></div><div class="hdet" id="det-${r.id}" hidden></div>`}).join(''):`<p class="note">No hay resultados. ¡Crea tu primer enlace desde el inicio!</p>`;
  };
  $('#hq').oninput=draw;$('#hk').onchange=draw;draw();window._recs=recs;
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ============ eventos globales ============ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='copy'){e.preventDefault();const f=b.closest('.row').querySelector('input,textarea');copyText(f.value)}
  else if(a==='theme'){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;ls.set('kl_theme',n)}
  else if(a==='home'){location.hash='#/'}
  else if(a==='scroll'){$('#tools').scrollIntoView({behavior:'smooth'})}
  else if(a==='settings'){$('#sCloud').value=cfg.cloud;$('#sPreset').value=cfg.preset;$('#setDlg').showModal()}
  else if(a==='savecfg'){cfg.cloud=$('#sCloud').value.trim()||DEFAULTS.cloud;cfg.preset=$('#sPreset').value.trim()||DEFAULTS.preset;ls.set('kl_cfg',{cloud:cfg.cloud,preset:cfg.preset});$('#setDlg').close();toast('Ajustes guardados','ok')}
  else if(a==='resetcfg'){Object.assign(cfg,DEFAULTS);ls.set('kl_cfg',{});$('#sCloud').value=cfg.cloud;$('#sPreset').value=cfg.preset;toast('Valores restablecidos','ok')}
  else if(a==='close'){b.closest('dialog').close()}
  else if(a==='login'){e.preventDefault();if(!fb)return toast('Firebase no se pudo cargar. Revisa tu conexión.','err');$('#aErr').textContent='';$('#authDlg').showModal()}
  else if(a==='logout'){try{await fb.A.signOut(fb.auth);toast('Sesión cerrada','ok')}catch(er){toast(aerr(er),'err')}}
  else if(a==='authmode'){authMode=b.dataset.m;$('#tabIn').className=authMode==='in'?'sec':'ghost';$('#tabUp').className=authMode==='up'?'sec':'ghost';$('#aGo').textContent=authMode==='in'?'Entrar':'Crear cuenta';$('#aPass').autocomplete=authMode==='in'?'current-password':'new-password'}
  else if(a==='google'){try{await fb.A.signInWithPopup(fb.auth,new fb.A.GoogleAuthProvider());$('#authDlg').close();toast('¡Bienvenido!','ok')}catch(er){$('#aErr').textContent=aerr(er)}}
  else if(a==='reset'){e.preventDefault();const m=$('#aMail').value.trim();if(!m){$('#aErr').textContent='Escribe tu correo arriba y vuelve a pulsar.';return}
    try{await fb.A.sendPasswordResetEmail(fb.auth,m);$('#aErr').style.color='var(--ok)';$('#aErr').textContent='Te enviamos un correo para restablecerla.'}catch(er){$('#aErr').style.color='var(--err)';$('#aErr').textContent=aerr(er)}}
  else if(a==='fetchurl'){processUrl(currentTool,$('#urlIn').value.trim())}
  else if(a==='copyall'){const L=linkSet(RECS.get(id));const all=[['Principal',L.main],...L.direct].map(([n,u])=>`${n}: ${u}`).join('\n');copyText(all)}
  else if(a==='nshare'){const L=linkSet(RECS.get(id));try{await navigator.share({title:RECS.get(id).name,url:L.main})}catch(er){}}
  else if(a==='deltoken'){const rec=RECS.get(id);if(!confirm('¿Borrar este archivo de Cloudinary? El enlace dejará de funcionar.'))return;
    try{const fd=new FormData();fd.append('token',rec.dt);const j=await(await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(rec.cloud)}/delete_by_token`,{method:'POST',body:fd})).json();
      if(j.result==='ok'){await removeRecord(id);b.closest('.card').querySelector('.out').innerHTML='<p class="note">Archivo borrado.</p>';toast('Borrado ✔','ok')}else toast('No se pudo borrar (el token dura 10 min).','err')}catch(er){toast('No se pudo borrar.','err')}}
  else if(a==='hcopy'){copyText(linkSet(RECS.get(id)).main)}
  else if(a==='hdet'){const d=$('#det-'+id);if(d.hidden){renderResult(RECS.get(id),d);d.hidden=false}else d.hidden=true}
  else if(a==='hdel'){if(!confirm('¿Quitar del historial? (el archivo sigue existiendo en Cloudinary)'))return;await removeRecord(id);window._recs=window._recs.filter(r=>r.id!==id);const it=b.closest('.hitem');$('#det-'+id)?.remove();it.remove()}
  else if(a==='exjson'){download('kendylink-historial.json',JSON.stringify(window._recs.map(r=>({name:r.name,kind:kindOf(r),url:linkSet(r).main,date:new Date(r.createdAt).toISOString()})),null,2),'application/json')}
  else if(a==='excsv'){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';download('kendylink-historial.csv','nombre,tipo,url,fecha\n'+window._recs.map(r=>[q(r.name),kindOf(r),q(linkSet(r).main),new Date(r.createdAt).toISOString()].join(',')).join('\n'),'text/csv')}
  else if(a==='clearlocal'){if(confirm('¿Borrar el historial guardado en este navegador?')){ls.set('kl_hist',[]);renderHistory()}}
});
$('#authForm').addEventListener('submit',async e=>{
  e.preventDefault();const m=$('#aMail').value.trim(),p=$('#aPass').value,er=$('#aErr');er.style.color='var(--err)';er.textContent='';
  if(!fb){er.textContent='Firebase no se pudo cargar.';return}
  try{authMode==='in'?await fb.A.signInWithEmailAndPassword(fb.auth,m,p):await fb.A.createUserWithEmailAndPassword(fb.auth,m,p);$('#authDlg').close();toast('¡Listo!','ok');e.target.reset()}
  catch(x){er.textContent=aerr(x)}
});
document.addEventListener('paste',e=>{
  if(!currentTool||!['upload','convert'].includes(currentTool.type))return;
  const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();handleFiles(currentTool,fs)}
});
