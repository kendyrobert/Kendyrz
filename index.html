<!--
MEDIACLOUD - CONFIGURACIÓN (una sola vez)
1) Firebase > Authentication > Método de acceso: habilita "Correo/contraseña" y "Google".
   Authentication > Configuración > Dominios autorizados: añade el dominio donde publiques (localhost ya viene).
2) Firebase > Firestore Database > Crear base de datos > pestaña Reglas: pega esto y Publica:

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signed() { return request.auth != null; }
    function isAdmin() { return signed() && exists(/databases/$(database)/documents/admins/$(request.auth.uid)); }
    match /users/{u} {
      allow read: if signed() && (request.auth.uid == u || isAdmin());
      allow create: if signed() && request.auth.uid == u
        && request.resource.data.keys().hasOnly(['name','email','quota','photo','createdAt'])
        && request.resource.data.quota == 10737418240;
      allow update: if signed() && request.auth.uid == u
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name','photo']);
    }
    match /files/{f} {
      allow read: if signed() && (resource.data.ownerId == request.auth.uid || isAdmin());
      allow create: if signed() && request.resource.data.ownerId == request.auth.uid;
      allow update: if signed() && resource.data.ownerId == request.auth.uid && request.resource.data.ownerId == request.auth.uid;
      allow delete: if signed() && resource.data.ownerId == request.auth.uid;
    }
    match /shares/{s} {
      allow get: if resource.data.active == true || (signed() && resource.data.ownerId == request.auth.uid);
      allow list: if signed() && (resource.data.ownerId == request.auth.uid || isAdmin());
      allow create: if signed() && request.resource.data.ownerId == request.auth.uid && request.resource.data.downloads == 0;
      allow update: if (signed() && resource.data.ownerId == request.auth.uid && request.resource.data.ownerId == request.auth.uid)
        || (resource.data.active == true
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['downloads'])
            && request.resource.data.downloads == resource.data.downloads + 1);
      allow delete: if signed() && resource.data.ownerId == request.auth.uid;
    }
    match /admins/{a} { allow read: if signed() && request.auth.uid == a; }
  }
}

3) Cloudinary > Settings > Upload > Upload presets: el preset "KendyR" debe estar en modo "Unsigned".

/* ---------- Subidas ---------- */
function prog(name,size){const r=document.createElement('div');r.className='up';r.innerHTML=`<div><b></b><small>${sz(size)}</small></div><div class="bar"><i></i></div><small class="s"></small>`;r.querySelector('b').textContent=name;$('#ups').append(r);const i=r.querySelector('i'),s=r.querySelector('.s');s.textContent='Subiendo… 0%';
return{set:p=>{i.style.width=p+'%';s.textContent=`Subiendo ${p}%`},ok:()=>{i.style.width='100%';s.textContent='✓ Archivo subido correctamente';r.classList.add('ok');setTimeout(()=>r.remove(),4000)},err:m=>{s.textContent='⚠️ '+m;r.classList.add('bad');setTimeout(()=>r.remove(),8000)}}}
function cld(file,onp){return new Promise((ok,ko)=>{const x=new XMLHttpRequest(),b=new FormData();b.append('file',file);b.append('upload_preset',CLOUD_PRESET);x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);x.upload.onprogress=e=>e.lengthComputable&&onp&&onp(Math.round(e.loaded/e.total*100));x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status===200&&j.secure_url?ok(j):ko(new Error(j.error?.message||'Cloudinary rechazó el archivo'))};x.onerror=()=>ko(new Error('Error de red al subir'));x.send(b)})}
function upload(list){const parent=S.parent,u=S.user.uid;let tot=used();[...list].forEach(async f=>{if(!f.size){toast(`${f.name}: no se pueden subir carpetas ni archivos vacíos`,1);return}
if(tot+f.size>quota()){toast('No tienes suficiente almacenamiento.',1);return}tot+=f.size;const p=prog(f.name,f.size);
try{const j=await cld(f,p.set);await addDoc(collection(db,'files'),{ownerId:u,name:f.name,size:f.size,mime:f.type,url:j.secure_url,pid:j.public_id,rt:j.resource_type,parent,isFolder:false,trashed:false,createdAt:serverTimestamp()});p.ok()}catch(e){tot-=f.size;p.err(em(e))}})}

const setT=ids=>t=>Promise.all(ids.map(async id=>{const f=byId(id);const d={trashed:t};if(!t||f.parent==='root'||byId(f.parent))null;else d.parent='root';await updateDoc(doc(db,'files',id),d);if(t&&S.shares.some(s=>s.id===id&&s.active))await updateDoc(doc(db,'shares',id),{active:false})}));
async function purge(ids){const all=new Set(),walk=i=>{all.add(i);S.files.filter(f=>f.parent===i).forEach(f=>walk(f.id))};ids.forEach(walk);
await Promise.all([...all].map(async i=>{const f=byId(i);if(!f)return;if(S.shares.some(s=>s.id===i))await deleteDoc(doc(db,'shares',i));await deleteDoc(doc(db,'files',i))}))}

p.innerHTML=L.map(([a,l])=>`<button data-a="${a}" data-id="${id}">${l}</button>`).join('');document.body.append(p)},

function route(){const h=location.hash;if(h.startsWith('#/s/'))return pub(h.slice(4));if(S.user===undefined)return;S.user?shell():authPages()}
addEventListener('hashchange',route);
async function ensureProfile(u){try{const r=doc(db,'users',u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{name:S.pendingName||u.displayName||u.email.split('@')[0],email:u.email,quota:QUOTA,photo:u.photoURL||'',createdAt:serverTimestamp()})}catch(e){toast(em(e),1)}}
let unsub=[];
onAuthStateChanged(auth,u=>{unsub.forEach(f=>f());unsub=[];Object.assign(S,{user:u,files:[],shares:[],profile:null,loaded:false,parent:'root',q:'',sel:new Set(),urls:{},page:'landing'});
if(u){ensureProfile(u);S.view='dash';unsub=[onSnapshot(doc(db,'users',u.uid),d=>{S.profile=d.data()||null;refresh()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'files'),where('ownerId','==',u.uid)),s=>{S.files=s.docs.map(mp);S.loaded=true;refresh()},e=>toast(em(e),1)),
onSnapshot(query(collection(db,'shares'),where('ownerId','==',u.uid)),s=>{S.shares=s.docs.map(mp);refresh()},e=>toast(em(e),1))]}
route()});

</script></body></html>
