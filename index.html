<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MediaLink Studio Ultra</title>
<meta name="description" content="Sube fotos, vídeos y música, genera enlaces reales y compártelos con cualquiera.">
<!--
  MediaLink Studio Ultra — frontend completo en un único archivo.
  Reglas de seguridad: firestore.rules y storage.rules (se publican con Firebase CLI).
  Instrucciones de instalación: README.md
-->
<style>
:root{--bg:#f5f6fb;--surface:#fff;--surface2:#eef0f8;--text:#14162b;--muted:#62698a;--line:#e1e4f0;--accent:#6c5ce7;--accent2:#00b4d8;--danger:#e5484d;--ok:#1f9d63;--warn:#c98200;--shadow:0 10px 30px rgba(30,30,80,.08);--r:16px}
[data-theme=dark]{--bg:#0a0c1a;--surface:#141731;--surface2:#1c2041;--text:#eef0ff;--muted:#9aa1c9;--line:#272c55;--shadow:0 12px 34px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.2}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 110px}
/* header */
.hdr{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.logo b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1.05rem}
.nav{display:flex;gap:4px;margin-left:16px}
.nav a{padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;display:flex;gap:7px;align-items:center;font-size:.92rem;transition:.15s}
.nav a.on,.nav a:hover{background:var(--surface2);color:var(--text)}
.sp{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;cursor:pointer;border:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.92rem;transition:transform .12s,box-shadow .12s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),#8a6cff 55%,var(--accent2));color:#fff;border:0;box-shadow:0 8px 22px rgba(108,92,231,.35)}
.btn.lg{padding:14px 24px;font-size:1.02rem;border-radius:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border:0}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn.icon{padding:0;width:34px;height:34px;border-radius:10px}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.page-head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:6px 0 20px}
.page-head h1{font-size:clamp(1.5rem,4vw,2rem)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(28px,6vw,64px);margin-bottom:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),color-mix(in srgb,var(--accent2) 16%,var(--surface)));border:1px solid var(--line)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 9s ease-in-out infinite}
.hero:before{width:280px;height:280px;background:var(--accent);top:-90px;right:-60px}
.hero:after{width:240px;height:240px;background:var(--accent2);bottom:-100px;left:10%;animation-delay:-4s}
@keyframes float{50%{transform:translate(20px,18px) scale(1.08)}}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:850;background:linear-gradient(120deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;max-width:15ch}
.hero p{max-width:52ch;margin:14px 0 24px;color:var(--muted);font-size:1.05rem}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:26px}
.feat .card{padding:18px}
.feat .ic{width:26px;height:26px;color:var(--accent);margin-bottom:8px}
.feat h4{margin-bottom:4px}.feat p{color:var(--muted);font-size:.9rem}
/* dropzone */
.dz{border:2px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:22px;padding:clamp(26px,5vw,52px) 18px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--accent) 5%,var(--surface));transition:.2s}
.dz:hover,.dz.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));transform:scale(1.005)}
.dz .ic{width:42px;height:42px;color:var(--accent);margin-bottom:8px}
.dz h3{font-size:1.2rem;margin-bottom:4px}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
select,input[type=text],input[type=email],input[type=password],input[type=search],input[type=datetime-local],textarea{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
select{width:auto;padding-right:28px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
label.f{display:block;margin-bottom:12px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{margin-top:5px;color:var(--text);font-weight:400}
textarea{min-height:84px;resize:vertical}
/* queue */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.qlist{display:grid;gap:10px}
.qi{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;align-items:center}
.qprev{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.qprev img,.qprev video{width:100%;height:100%;object-fit:cover}
.qname{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:2px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .2s}
.qi.done .bar>i{background:var(--ok)}.qi.error .bar>i,.qi.canceled .bar>i{background:var(--danger)}
.qact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{font-weight:700}.st.done{color:var(--ok)}.st.error,.st.canceled{color:var(--danger)}
/* library */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}.stat small{color:var(--muted);font-weight:600}.stat b{display:block;font-size:1.5rem;letter-spacing:-.02em}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.media{position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.media:hover{transform:translateY(-3px)}
.media.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--surface2);display:grid;place-items:center;color:var(--accent);cursor:pointer;overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ic.big{width:38px;height:38px}
.thumb .play{position:absolute;inset:auto 10px 10px auto;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.thumb.mini{aspect-ratio:1;border-radius:10px}
.chk{position:absolute;top:10px;left:10px;z-index:3;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.badge,.vis{position:absolute;z-index:3;top:10px;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:99px;display:flex;align-items:center;gap:4px;color:#fff;backdrop-filter:blur(4px)}
.badge{right:10px;background:rgba(0,0,0,.55)}
.vis{left:44px}.vis.public{background:rgba(31,157,99,.85)}.vis.private{background:rgba(201,130,0,.9)}
.body{padding:12px 13px 13px}
.body h4{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.actions .btn.icon{width:31px;height:31px;border-radius:9px}
.empty{text-align:center;padding:50px 18px;color:var(--muted)}
.empty .ic{width:44px;height:44px;margin-bottom:8px;color:var(--accent)}
table.hist{width:100%;border-collapse:collapse;font-size:.9rem}
.hist th{text-align:left;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line)}
.hist td{padding:11px 14px;border-bottom:1px solid var(--line)}
.hist tr:last-child td{border:0}
.hist .nm{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.scroll-x{overflow-x:auto}
/* collections */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.mosaic{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;aspect-ratio:16/9;background:var(--surface2);overflow:hidden}
.mosaic .thumb{aspect-ratio:auto;height:100%;border-radius:0;cursor:default}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;max-height:260px;overflow:auto;padding:4px}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;top:6px;left:6px;z-index:2;accent-color:var(--accent);width:17px;height:17px}
.pick .thumb{outline:2px solid transparent}
.pick input:checked~.thumb{outline-color:var(--accent)}
/* modal / toast */
.ov{position:fixed;inset:0;z-index:100;background:rgba(5,6,20,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .2s}
.dlg.wide{width:min(720px,100%)}
.dlg h3{margin-bottom:14px;font-size:1.2rem}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.share-top{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:start}
.qr{background:#fff;border-radius:14px;padding:8px;width:170px}
.qr svg{display:block;width:100%;height:auto}
.crow{display:flex;gap:6px;margin-bottom:10px}
.crow input{font-size:.82rem}
.notice{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:.88rem;margin-bottom:14px}
.notice.info{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
#toasts{position:fixed;z-index:200;right:14px;bottom:84px;display:grid;gap:8px;max-width:min(380px,calc(100vw - 28px))}
.toast{padding:12px 15px;border-radius:13px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);box-shadow:var(--shadow);animation:pop .25s;font-size:.9rem}
.toast.ok{border-left-color:var(--ok)}.toast.error{border-left-color:var(--danger)}
/* auth */
.authbox{max-width:430px;margin:30px auto;padding:26px}
.tabs{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px;margin-bottom:16px}
.prof .avatar{width:72px;height:72px;font-size:1.8rem;cursor:default}
.meter{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* player */
.player{position:relative;border-radius:18px;overflow:hidden;background:#000;display:grid;place-items:center}
.player img{max-width:100%;max-height:72vh;display:block;object-fit:contain}
.player video{width:100%;max-height:72vh;display:block;background:#000}
.player .fs{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border:0}
.player.aud{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,#0b0d22),color-mix(in srgb,var(--accent2) 30%,#0b0d22));padding:34px 20px;gap:18px;color:#fff}
.disc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1b1f3d 28%,#2d3270 30%,#0b0d22 70%);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.disc .ic{width:38px;height:38px}
.player.aud.playing .disc{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{display:flex;gap:4px;height:26px;align-items:flex-end}
.eq i{width:5px;background:#fff;border-radius:3px;height:20%;opacity:.8}
.player.aud.playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.45s!important}.eq i:nth-child(5){animation-delay:.6s!important}
@keyframes eq{50%{height:100%}}
.player audio{width:min(480px,100%)}
.viewer{max-width:980px}
.vinfo{padding:18px;margin-top:16px}
.vinfo h1{font-size:1.5rem;margin-bottom:6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.vgrid .card{overflow:hidden}
/* lightbox */
.lb{position:fixed;inset:0;z-index:150;background:rgba(3,4,14,.94);display:grid;grid-template-rows:1fr auto;padding:14px;animation:fade .15s}
.lb-stage{display:grid;place-items:center;min-height:0;position:relative}
.lb-stage .player{max-width:min(1100px,100%);width:100%}
.lb-stage .player img,.lb-stage .player video{max-height:78vh}
.lb button.nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:2}
.lb .prev{left:0}.lb .next{right:0}
.lb .lbx{position:absolute;top:0;right:0;z-index:3}
.lb-cap{color:#fff;text-align:center;padding:12px;font-size:.92rem}
.loading{text-align:center;padding:60px;color:var(--muted)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
.desk-only{display:flex}
@media(max-width:820px){
 .nav{position:fixed;bottom:0;left:0;right:0;margin:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .nav a{flex-direction:column;font-size:.68rem;gap:2px;padding:6px 10px}
 .desk-only{display:none!important}
 .share-top{grid-template-columns:1fr;justify-items:center}
 .logo span.t{font-size:.95rem}
 #toasts{bottom:78px}
 .hide-m{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function urlFor(f) {
  if (f.url) { urlSync.set(f.path, f.url); return Promise.resolve(f.url); }
  if (urlP.has(f.path)) return urlP.get(f.path);
  const p = getDownloadURL(ref(storage, f.path)).then(u => { urlSync.set(f.path, u); return u; }).catch(e => { urlP.delete(f.path); throw e; });

/* ---------- QR (local) ---------- */
function qrSVG(text) {
  if (typeof qrcode !== "function") return `<p style="color:#333;font-size:.8rem;padding:10px">No se pudo cargar el generador de QR.</p>`;
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 2; let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function downloadQR(text, name) {
  const svg = qrSVG(text), img = new Image(), url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 640; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; x.drawImage(img, 0, 0, 640, 640);
    c.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "qr-" + name.replace(/[^\w.-]+/g, "_") + ".png"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }); URL.revokeObjectURL(url);
  };
  img.src = url;
}

  unsubscribe();
  unsubF = onSnapshot(query(collection(db, "files"), where("ownerId", "==", uid)), snap => {
    S.files = snap.docs.map(d => ({ id: d.id, ...d.data() }));

   ============================================================ */
const MAX_PAR = 3;
function stageFiles(list) {
  if (!S.user) { toast("Inicia sesión para subir archivos", "info"); location.hash = "#auth"; return; }
  const rejected = [];
  for (const file of list) {
    const c = classify(file);
    if (!c) { rejected.push(`${file.name}: formato no permitido`); continue; }
    if (!file.size) { rejected.push(`${file.name}: archivo vacío`); continue; }
    const max = APP_CONFIG.maxMB[c.kind] * 1048576;
    if (file.size > max) { rejected.push(`${file.name}: supera ${APP_CONFIG.maxMB[c.kind]} MB`); continue; }
    S.queue.push({ id: uid8(), file, ...c, previewUrl: c.kind === "audio" ? "" : URL.createObjectURL(file), status: "queued", progress: 0, speed: 0, vis: S.defVis });
  }
  if (rejected.length) toast(rejected.slice(0, 4).join("\n") + (rejected.length > 4 ? `\n…y ${rejected.length - 4} más` : ""), "error", 7000);
  if (location.hash !== "#upload") location.hash = "#upload"; else renderQueue();
  pump();
}
function pump() {
  let slots = MAX_PAR - S.queue.filter(q => q.status === "uploading").length;
  for (const q of S.queue) { if (slots <= 0) break; if (q.status === "queued") { runUpload(q); slots--; } }
}
async function runUpload(q) {
  const user = S.user; if (!user) return;
  q.status = "uploading"; q.progress = 0; q.speed = 0; q.lastT = performance.now(); q.lastB = 0; renderQueue();
  const docRef = doc(collection(db, "files")), id = docRef.id, path = `files/${user.uid}/${id}.${q.ext}`;
  const sref = ref(storage, path);
  const task = uploadBytesResumable(sref, q.file, { contentType: q.contentType, customMetadata: { ownerId: user.uid } });
  q.task = task;
  setTimeout(() => { if (q.status === "uploading" && !(q.bytes > 0)) toast("La subida no avanza. Comprueba que Storage esté creado y que las reglas de storage.rules estén publicadas (Firebase → Storage → Reglas).", "error", 10000); }, 20000);
  task.on("state_changed", snap => {
    const now = performance.now(), dt = (now - q.lastT) / 1000;
    if (dt >= 0.4) { const inst = (snap.bytesTransferred - q.lastB) / dt; q.speed = q.speed ? q.speed * .6 + inst * .4 : inst; q.lastT = now; q.lastB = snap.bytesTransferred; }
    q.progress = snap.totalBytes ? snap.bytesTransferred / snap.totalBytes * 100 : 0; q.bytes = snap.bytesTransferred; updateQ(q);
  }, err => {
    q.status = err.code === "storage/canceled" ? "canceled" : "error"; q.error = errMsg(err); renderQueue(); pump();
    if (q.status === "error") toast(`${q.file.name}: ${q.error}`, "error");
  }, async () => {
    try {
      const url = await getDownloadURL(sref);
      const data = {
        ownerId: user.uid, ownerName: user.displayName || (user.email || "").split("@")[0], name: q.file.name, title: q.file.name.replace(/\.[^.]+$/, ""),
        description: "", kind: q.kind, contentType: q.contentType, ext: q.ext, size: q.file.size, path, visibility: q.vis,
        expiresAt: null, views: 0, downloads: 0, createdAt: serverTimestamp()
      };
      if (q.vis === "public") data.url = url;
      await setDoc(docRef, data);
      q.fileDoc = { id, ...data, url: q.vis === "public" ? url : undefined, createdAt: Timestamp.now() };
      q.progress = 100; q.status = "done"; urlSync.set(path, url);
      toast(`Subido: ${q.file.name}`, "ok", 2600);
    } catch (e) {
      try { await deleteObject(sref); } catch { }
      q.status = "error"; q.error = errMsg(e); toast(`${q.file.name}: ${q.error}`, "error");
    }
    renderQueue(); pump();
  });
}
function updateQ(q) {
  const el = document.getElementById("q-" + q.id); if (!el) return;
  el.querySelector(".bar>i").style.width = q.progress.toFixed(1) + "%";
  const eta = q.speed > 0 ? Math.max(0, Math.round((q.file.size - (q.bytes || 0)) / q.speed)) : 0;
  el.querySelector(".qstat").textContent = `${q.progress.toFixed(0)}% · ${fmtSize(q.bytes || 0)} / ${fmtSize(q.file.size)}`;
  el.querySelector(".qspeed").textContent = q.speed ? `${fmtSize(q.speed)}/s${eta ? " · " + eta + " s" : ""}` : "";
}
const STATUS = { ready: "Listo para subir", queued: "En cola", uploading: "Subiendo", done: "Completado", error: "Error", canceled: "Cancelado" };
function qItemHTML(q) {
  const prev = q.kind === "image" ? `<img src="${q.previewUrl}" alt="">` : q.kind === "video" ? `<video src="${q.previewUrl}#t=0.4" muted preload="metadata" playsinline></video>` : icon("music", "big");

  if (q.status === "ready") acts = `<button class="btn sm" data-act="removeQ" data-id="${q.id}">${icon("x")} Quitar</button>`;
  else if (q.status === "queued" || q.status === "uploading") acts = `<button class="btn sm danger" data-act="cancelQ" data-id="${q.id}">${icon("x")} Cancelar</button>`;
  else if (q.status === "error" || q.status === "canceled") acts = `<button class="btn sm" data-act="retryQ" data-id="${q.id}">Reintentar</button><button class="btn sm" data-act="removeQ" data-id="${q.id}">Quitar</button>`;

function renderQueue() {

async function applyVisibility(f, vis) {
  const r = doc(db, "files", f.id);
  if (vis === "public") { const u = await urlFor(f); await updateDoc(r, { visibility: "public", url: u }); f.url = u; }
  else { await updateDoc(r, { visibility: "private", url: deleteField() }); delete f.url; }
  f.visibility = vis;
}

async function downloadFile(f) {

  try {
    const r = await fetch(u); if (!r.ok) throw 0;
    const b = await r.blob(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = f.name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch {

}

    try {
      try { await deleteObject(ref(storage, f.path)); } catch (e) { if (e.code !== "storage/object-not-found") throw e; }
      await deleteDoc(doc(db, "files", f.id));
      const b = writeBatch(db); let n = 0;
      S.cols.filter(c => (c.fileIds || []).includes(f.id)).forEach(c => { b.update(doc(db, "collections", c.id), { fileIds: arrayRemove(f.id) }); n++; });
      if (n) await b.commit();
      S.selected.delete(f.id); ok++;
    } catch (e) { toast(`No se pudo eliminar ${f.name}: ${errMsg(e)}`, "error"); }
  }
  if (ok) toast(ok === 1 ? "Archivo eliminado" : `${ok} archivos eliminados`, "ok");
}

document.addEventListener("play", e => e.target.closest?.(".player.aud")?.classList.add("playing"), true);

function openLightbox(list, i) {
  let idx = i; const root = document.createElement("div"); root.className = "lb"; document.body.append(root);
  const close = () => { root.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1); };
  async function show() {
    const f = list[idx];
    root.innerHTML = `<div class="lb-stage"><button class="btn icon lbx" aria-label="Cerrar" data-x>${icon("x")}</button>
      ${list.length > 1 ? `<button class="nv prev" aria-label="Anterior" data-p>${icon("chevL")}</button><button class="nv next" aria-label="Siguiente" data-n>${icon("chevR")}</button>` : ""}
      <div id="lbp" class="loading"><span class="spin"></span></div></div><div class="lb-cap"><b>${esc(f.title)}</b><div style="opacity:.7;font-size:.82rem">${idx + 1} / ${list.length} · ${f.ext.toUpperCase()} · ${fmtSize(f.size)}</div></div>`;
    root.querySelector("[data-x]").onclick = close;
    root.querySelector("[data-p]")?.addEventListener("click", () => go(-1)); root.querySelector("[data-n]")?.addEventListener("click", () => go(1));
    try { const u = await urlFor(f); if (list[idx] === f) $("#lbp", root).outerHTML = playerHTML(f, u); } catch (e) { $("#lbp", root).textContent = "No se pudo cargar: " + errMsg(e); }
  }
  const go = d => { idx = (idx + d + list.length) % list.length; show(); };
  root.addEventListener("mousedown", e => { if (e.target === root || e.target.classList.contains("lb-stage")) close(); });
  document.addEventListener("keydown", key); show();
}

  return `<header class="hdr"><div class="hdr-in"><a class="logo" href="#home"><b>${icon("link")}</b><span class="t">MediaLink Studio <span style="color:var(--accent)">Ultra</span></span></a>
    <nav class="nav">${navLink("home", "home", "Inicio")}${navLink("upload", "upload", "Subir")}${navLink("library", "grid", "Biblioteca")}${navLink("collections", "layers", "Colecciones")}${navLink("history", "clock", "Historial", "desk-only")}</nav><div class="sp"></div>
    <button class="btn icon" data-act="theme" title="Cambiar tema" aria-label="Cambiar tema">${icon(document.documentElement.dataset.theme === "dark" ? "sun" : "moon")}</button>
    ${S.user ? `<button class="avatar" data-act="goProfile" title="Mi perfil" aria-label="Mi perfil">${esc(name[0].toUpperCase())}</button>` : `<a class="btn primary" href="#auth">Entrar</a>`}</div></header>`;
}
function render() {
  if (VIEWER) return;
  let r = (location.hash.replace("#", "") || "home").split("?")[0];
  if (!["home", "upload", "library", "collections", "history", "profile", "auth"].includes(r)) r = "home";
  const needsAuth = ["upload", "library", "collections", "history", "profile"].includes(r);
  if (S.user && r === "auth") { location.hash = "#library"; return; }
  S.view = needsAuth && !S.user ? "auth" : r;
  let page;
  if (S.view === "auth") page = authPage(needsAuth);
  else page = { home: homePage, upload: uploadPage, library: libraryPage, collections: collectionsPage, history: historyPage, profile: profilePage }[S.view]();
  const scroll = scrollY;
  const warn = location.protocol === "file:" ? `<div class="notice">${icon("alert")} Abriste la página como archivo local (file://): el inicio de sesión y las subidas no funcionarán así. Ejecútala con <b>firebase serve --only hosting</b> (http://localhost:5000) o publícala en Firebase Hosting.</div>` : "";
  $("#app").innerHTML = headerHTML() + `<main class="wrap">${warn}${page}</main>`;
  if (S.view === "library") renderLibraryParts();
  if (S.view === "upload") renderQueue();
  hydrate($("#app")); if (S.view === "library" || S.view === "home") scrollTo(0, scroll);
}

/* ============================================================
   PÁGINA DE VISUALIZACIÓN  (?v=ID archivo · ?c=ID colección)
   ============================================================ */
function viewerHeader(embed) {
  if (embed) return "";
  return `<header class="hdr"><div class="hdr-in"><a class="logo" href="${location.pathname}"><b>${icon("link")}</b><span class="t">MediaLink Studio <span style="color:var(--accent)">Ultra</span></span></a><div class="sp"></div>
  <button class="btn icon" data-act="theme" aria-label="Cambiar tema">${icon(document.documentElement.dataset.theme === "dark" ? "sun" : "moon")}</button><a class="btn primary" href="${location.pathname}">Abrir la app</a></div></header>`;
}
const denied = () => `<div class="card empty">${icon("lock")}<h3>Contenido no disponible</h3><p>No existe, es privado o ha caducado.</p></div>`;
async function renderViewer() {
  await authReady;
  const embed = P.get("embed") === "1";
  $("#app").innerHTML = viewerHeader(embed) + `<main class="wrap viewer" id="vwr" style="${embed ? "padding:8px" : ""}"><div class="loading"><span class="spin"></span>Cargando…</div></main>`;
  try { P.get("v") ? await viewFile(P.get("v"), embed) : await viewCollection(P.get("c"), embed); }
  catch (e) { $("#vwr").innerHTML = denied(); console.warn(e); }
}
async function viewFile(id, embed) {
  const snap = await getDoc(doc(db, "files", id));
  if (!snap.exists()) throw new Error("no existe");
  const f = { id, ...snap.data() }; viewerCache.set(id, f);
  const u = await urlFor(f); document.title = f.title + " · MediaLink Studio Ultra";
  if (!isOwner(f) && !sessionStorage.getItem("v-" + id)) { try { sessionStorage.setItem("v-" + id, 1); } catch { } countStat(f, "views"); }
  $("#vwr").innerHTML = playerHTML(f, u) + (embed ? "" : `<div class="card vinfo"><h1>${esc(f.title)}</h1>${f.description ? `<p class="muted" style="margin-bottom:10px;white-space:pre-wrap">${esc(f.description)}</p>` : ""}
    <div class="meta" style="margin-bottom:14px"><span>${esc(f.name)}</span><span>${f.ext.toUpperCase()}</span><span>${fmtSize(f.size)}</span><span>${fmtDate(f)}</span>${f.ownerName ? `<span>${icon("user")} ${esc(f.ownerName)}</span>` : ""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="download" data-id="${id}">${icon("download")} Descargar</button><button class="btn" data-act="copyLink" data-id="${id}">${icon("link")} Copiar enlace</button><button class="btn" data-act="share" data-id="${id}">${icon("share")} Compartir</button><button class="btn" data-act="qrOpen" data-id="${id}">${icon("qr")} QR</button></div></div>`);
}
async function viewCollection(id, embed) {
  const snap = await getDoc(doc(db, "collections", id));
  if (!snap.exists()) throw new Error("no existe");
  const c = { id, ...snap.data() }; document.title = c.title + " · MediaLink Studio Ultra";
  const res = await Promise.allSettled((c.fileIds || []).map(fid => getDoc(doc(db, "files", fid))));
  const files = res.filter(r => r.status === "fulfilled" && r.value.exists()).map(r => { const f = { id: r.value.id, ...r.value.data() }; viewerCache.set(f.id, f); return f; });
  S._gal = files;
  $("#vwr").innerHTML = (embed ? "" : `<div class="page-head"><div><h1>${esc(c.title)}</h1>${c.description ? `<p class="muted">${esc(c.description)}</p>` : ""}<p class="muted" style="font-size:.85rem">${files.length} archivos</p></div>
    <div style="display:flex;gap:8px"><button class="btn" data-act="copyColLink" data-id="${id}">${icon("link")} Copiar enlace</button><button class="btn primary" data-act="colShareV" data-id="${id}">${icon("share")} Compartir</button></div></div>`) +
    (files.length ? `<div class="vgrid">${files.map((f, i) => `<div class="card" style="cursor:pointer" data-act="galOpen" data-i="${i}"><div class="thumb" data-id="${f.id}">${thumbInner(f)}</div><div class="body"><h4>${esc(f.title)}</h4><div class="meta"><span>${f.ext.toUpperCase()}</span><span>${fmtSize(f.size)}</span></div></div></div>`).join("")}</div>` : `<div class="card empty">${icon("folder")}<p>Esta colección no tiene archivos visibles.</p></div>`);
  window._col = c; hydrate($("#vwr"));
}

/* ============================================================
   EVENTOS
   ============================================================ */
const ACT = {
  pickFiles() { if (!S.user) { toast("Inicia sesión para subir archivos", "info"); location.hash = "#auth"; return; } $("#fileInput").click(); },
  theme() { applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); VIEWER ? renderViewer() : render(); },
  goProfile() { location.hash = "#profile"; },
  async logout() { if (await confirmDlg({ title: "Cerrar sesión", text: "¿Quieres salir de tu cuenta?", ok: "Cerrar sesión" })) { await signOut(auth); location.hash = "#home"; toast("Sesión cerrada", "ok"); } },
  authMode(d) { S.authMode = d.m; render(); },
  async resetPw() {
    const email = $("form[data-form=auth] [name=email]")?.value.trim();
    if (!email) return toast("Escribe tu correo arriba y pulsa de nuevo.", "info");
    try { await sendPasswordResetEmail(auth, email); toast("Te enviamos un correo para restablecer la contraseña.", "ok", 6000); } catch (e) { toast(errMsg(e), "error"); }
  },
  closeModal() { closeModal(); },
  fullscreen(d, el) { const p = el.closest(".player"); (p.requestFullscreen || p.webkitRequestFullscreen)?.call(p); },
  /* cola */
  removeQ(d) { const q = S.queue.find(x => x.id === d.id); if (q?.previewUrl) URL.revokeObjectURL(q.previewUrl); S.queue = S.queue.filter(x => x.id !== d.id); renderQueue(); },
  cancelQ(d) { const q = S.queue.find(x => x.id === d.id); if (!q) return; if (q.status === "uploading") q.task?.cancel(); else { q.status = "canceled"; renderQueue(); } },
  retryQ(d) { const q = S.queue.find(x => x.id === d.id); if (q) { q.status = "queued"; q.error = ""; renderQueue(); pump(); } },
  startAll() { S.queue.forEach(q => { if (q.status === "ready") q.status = "queued"; }); renderQueue(); pump(); },
  clearQueue() { S.queue = S.queue.filter(q => !["done", "canceled", "error"].includes(q.status) || (q.previewUrl && 0)); renderQueue(); },
  /* biblioteca */
  filter(d) { S.filter = d.k; render(); },
  toggleSel(d, el) { el.checked ? S.selected.add(d.id) : S.selected.delete(d.id); el.closest(".media")?.classList.toggle("sel", el.checked); renderLibraryParts(); },
  selAll() { visibleFiles().forEach(f => S.selected.add(f.id)); renderLibraryParts(); },
  selNone() { S.selected.clear(); renderLibraryParts(); },
  async delSel() {
    const l = S.files.filter(f => S.selected.has(f.id)); if (!l.length) return;
    if (await confirmDlg({ title: `Eliminar ${l.length} archivo${l.length > 1 ? "s" : ""}`, text: "Se borrarán de Storage y de tu biblioteca. Los enlaces dejarán de funcionar. Esta acción no se puede deshacer.", ok: "Eliminar", danger: true })) deleteFiles(l);
  },
  colFromSel() { openColModal(null); },
  preview(d) { const list = visibleFiles().length && S.view === "library" ? visibleFiles() : S.files; const i = list.findIndex(f => f.id === d.id); if (i >= 0) openLightbox(list, i); },
  galOpen(d) { openLightbox(S._gal, +d.i); },
  /* acciones por archivo */
  copyLink(d) { const f = getFile(d.id); if (!f) return; if (f.visibility === "private") return openShare({ type: "file", o: f }); copyText(pageLink(f.id)); },
  share(d) { const f = getFile(d.id); if (f) openShare({ type: "file", o: f }); },
  qrOpen(d) { const f = getFile(d.id); if (f) openShare({ type: "file", o: f }); },
  openFile(d) { window.open(pageLink(d.id), "_blank", "noopener"); },
  download(d) { const f = getFile(d.id); if (f) downloadFile(f); },
  edit(d) { const f = getFile(d.id); if (f) openEdit(f); },
  async del(d) {
    const f = getFile(d.id); if (!f) return;
    if (await confirmDlg({ title: "Eliminar archivo", text: `«${esc(f.title)}» se borrará de forma permanente y su enlace dejará de funcionar.`, ok: "Eliminar", danger: true })) { await deleteFiles([f]); S.queue.forEach(q => { if (q.fileDoc?.id === f.id) q.fileDoc = null, q.status = "canceled"; }); renderQueue(); }
  },
  /* modal compartir */
  copyVal(d, el) { const m = el.closest(".dlg"); copyText(m._vals[d.v], "Copiado"); },
  nativeShare(d, el) { const m = el.closest(".dlg"); const o = m._t.o; if (navigator.share) navigator.share({ title: o.title, url: m._link }).catch(() => { }); else copyText(m._link); },
  qrDl(d, el) { const m = el.closest(".dlg"); downloadQR(m._link, m._t.o.title || "enlace"); },
  async makePublicShare(d, el) {
    const t = el.closest(".dlg")._t; busy(el, true);
    try {
      if (t.type === "file") await applyVisibility(t.o, "public");
      else { await updateDoc(doc(db, "collections", t.o.id), { visibility: "public" }); t.o.visibility = "public"; await ensureFilesPublic(t.o.fileIds || []); }
      toast("Ahora es público", "ok"); openShare(t);
    } catch (e) { toast(errMsg(e), "error"); busy(el, false); }
  },
  /* colecciones */
  newCol() { openColModal(null); },
  colEdit(d) { openColModal(S.cols.find(c => c.id === d.id)); },
  colOpen(d) { window.open(colLink(d.id), "_blank", "noopener"); },
  colShare(d) { openShare({ type: "col", o: S.cols.find(c => c.id === d.id) }); },
  colShareV() { const c = window._col; if (c) openShare({ type: "col", o: c }); },
  copyColLink(d) { copyText(colLink(d.id)); },
  async colDel(d) {
    const c = S.cols.find(x => x.id === d.id); if (!c) return;
    if (await confirmDlg({ title: "Eliminar colección", text: `Se eliminará «${esc(c.title)}». Los archivos no se borran.`, ok: "Eliminar", danger: true })) { try { await deleteDoc(doc(db, "collections", c.id)); toast("Colección eliminada", "ok"); } catch (e) { toast(errMsg(e), "error"); } }
  }
};
async function ensureFilesPublic(ids) {
  const priv = ids.map(id => S.files.find(f => f.id === id)).filter(f => f && f.visibility === "private");
  if (!priv.length) return;
  if (await confirmDlg({ title: "Archivos privados en la colección", text: `${priv.length} archivo${priv.length > 1 ? "s son privados y no se verían" : " es privado y no se vería"} en la galería compartida. ¿Hacerlos públicos?`, ok: "Hacerlos públicos" })) {
    for (const f of priv) { try { await applyVisibility(f, "public"); } catch (e) { toast(errMsg(e), "error"); } }
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; renderLibraryParts(); } });
document.addEventListener("change", e => {
  if (e.target.id === "sort") { S.sort = e.target.value; renderLibraryParts(); }
  if (e.target.id === "defVis") { S.defVis = e.target.value; S.queue.forEach(q => { if (q.status === "ready") q.vis = S.defVis; }); renderQueue(); }
  if (e.target.id === "fileInput") { stageFiles([...e.target.files]); e.target.value = ""; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); if ((e.key === "Enter" || e.key === " ") && e.target.id === "dz") { e.preventDefault(); ACT.pickFiles(); } });
/* arrastrar y soltar */
["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { if (!e.dataTransfer?.types?.includes("Files")) return; e.preventDefault(); e.target.closest?.(".dz")?.classList.add("over"); }));
document.addEventListener("dragleave", e => e.target.closest?.(".dz")?.classList.remove("over"));
document.addEventListener("drop", e => {
  if (!e.dataTransfer?.types?.includes("Files")) return; e.preventDefault();
  document.querySelectorAll(".dz.over").forEach(d => d.classList.remove("over"));
  if (VIEWER) return; stageFiles([...e.dataTransfer.files]);
});
/* formularios */
const FORMS = {
  async auth(f) {
    const fd = new FormData(f), email = fd.get("email").trim(), pass = fd.get("password"), b = f.querySelector("[type=submit]"); busy(b, true);
    try {
      if (S.authMode === "register") {
        const cr = await createUserWithEmailAndPassword(auth, email, pass), name = (fd.get("name") || "").trim() || email.split("@")[0];
        await updateProfile(cr.user, { displayName: name });
        try { await setDoc(doc(db, "users", cr.user.uid), { displayName: name, email, createdAt: serverTimestamp() }); } catch { }
        toast("¡Cuenta creada!", "ok");
      } else await signInWithEmailAndPassword(auth, email, pass);
      location.hash = "#library"; render();
    } catch (e) { toast(errMsg(e), "error"); busy(b, false); }
  },
  async profile(f) {
    const name = new FormData(f).get("name").trim(), b = f.querySelector("[type=submit]"); busy(b, true);
    try { await updateProfile(auth.currentUser, { displayName: name }); await setDoc(doc(db, "users", auth.currentUser.uid), { displayName: name, email: auth.currentUser.email }, { merge: true }); toast("Perfil actualizado", "ok"); render(); }
    catch (e) { toast(errMsg(e), "error"); busy(b, false); }
  },
  async edit(f) {
    const fd = new FormData(f), file = getFile(f.dataset.id), b = f.querySelector("[type=submit]"); if (!file) return; busy(b, true);
    let name = fd.get("name").trim(); if (!/\.[A-Za-z0-9]{2,5}$/.test(name)) name += "." + file.ext;
    const exp = fd.get("expires"), upd = { title: fd.get("title").trim().slice(0, 150), name, description: fd.get("description").trim().slice(0, 800), expiresAt: exp ? Timestamp.fromDate(new Date(exp)) : null };
    try {
      const vis = fd.get("visibility");
      if (vis !== file.visibility) {
        if (vis === "public") { upd.url = await urlFor(file); upd.visibility = "public"; } else { upd.url = deleteField(); upd.visibility = "private"; }
      }
      await updateDoc(doc(db, "files", file.id), upd); closeModal(); toast("Cambios guardados", "ok");
    } catch (e) { toast(errMsg(e), "error"); busy(b, false); }
  },
  async col(f) {
    const fd = new FormData(f), id = f.dataset.id, b = f.querySelector("[type=submit]"); busy(b, true);
    const data = { title: fd.get("title").trim().slice(0, 100), description: fd.get("description").trim().slice(0, 400), visibility: fd.get("visibility"), fileIds: fd.getAll("fid").slice(0, 100) };
    try {
      if (id) await updateDoc(doc(db, "collections", id), data);
      else await addDoc(collection(db, "collections"), { ...data, ownerId: S.user.uid, createdAt: serverTimestamp() });
      closeModal(); S.selected.clear(); toast("Colección guardada", "ok");
      if (data.visibility === "public") await ensureFilesPublic(data.fileIds);
      if (S.view === "library") renderLibraryParts();
    } catch (e) { toast(errMsg(e), "error"); busy(b, false); }
  }
};
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); await FORMS[f.dataset.form]?.(f);
});
window.addEventListener("hashchange", () => { if (!VIEWER) { render(); scrollTo(0, 0); } });
window.addEventListener("beforeunload", e => { if (S.queue.some(q => q.status === "uploading")) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- arranque ---------- */
if (VIEWER) renderViewer(); else authReady.then(render);
</script>
</body>
</html>
